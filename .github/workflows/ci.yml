name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Shared contract tests
        run: npm run test:shared
      - name: Server tests
        run: npm run test:server
      - name: Web build (online, coords stripped)
        run: npm run build
      - name: Assert online bundle has no answer coords
        run: node scripts/check_bundle_coords.mjs online
      - name: Web build (demo, coords kept)
        run: npm run build:demo
      - name: Assert demo bundle keeps coords
        run: node scripts/check_bundle_coords.mjs demo
