<script>
const D=[{"m":"中国篇","t":2,"n":"李时珍采药","a":"湖北省","p":"现图为人物塑像，与采药场景不符。","d":"明嘉靖三十一年（1552年），李时珍开始系统性药物考察与采集，以家乡蕲州为中心辐射周边，今湖北省黄冈市蕲春县蕲州镇为其主要采药基地与著述场所；他遍访湖广、江西、江苏等地山野，亲尝百草，纠正前人谬误，历时二十七年完成《本草纲目》；该书收药一千八百九十二种，附方一万一千余首，确立药物分类新体系；黄冈所处大别山南麓湿润山地环境，为明代中医药资源调查提供了典型地理样本空间。","q":"明万历年间，工笔设色：李时珍背药篓持药锄行于山径，采撷草药、记录本草，随行弟子负笈，层峦与云雾"},{"m":"中国篇","t":2,"n":"王安石变法","a":"河南省","p":"现图为现代馆舍/文字图，与变法场景无关。","d":"北宋熙宁二年（1069年），王安石在东京开封府被宋神宗任命为参知政事，启动以富国强兵为目标的系列改革，今河南省开封市龙亭区北宋皇宫遗址周边为其主要施政中心；推行青苗法、募役法、方田均税法及保甲法等；虽因触动官僚地主利益引发激烈党争，最终未能持续，但其财政管理理念与基层组织设计影响深远；开封作为当时世界最大都市，其城市治理实践构成变法实施的关键空间载体。","q":"北宋熙宁年间汴京朝堂，工笔设色：王安石着紫袍执笏立于御阶前陈奏新法，宋神宗端坐听政，殿内群臣或颔首或侧目，案上摊开青苗法条陈，烛火与朱柱"},{"m":"中国篇","t":2,"n":"王羲之兰亭雅集","a":"浙江省","p":"现图无法指认兰亭雅集。","d":"东晋永和九年三月三日，王羲之与谢安、孙绰等四十余名士在会稽山阴县兰亭举行修禊活动，临流赋诗，王羲之挥毫写下《兰亭序》，成为行书典范。事件发生地今属浙江省绍兴市柯桥区兰亭街道，该地自唐宋起持续修建纪念性建筑，现存兰亭碑亭与曲水流觞池为历代重建遗存。","q":"东晋永和九年会稽兰亭，工笔设色：王羲之与四十余名士列坐曲水之侧，羽觞随流，竹影溪石，王羲之执笔于案上挥毫作序，春衫宽袖"},{"m":"中国篇","t":2,"n":"陈桥兵变","a":"河南省","p":"现图为文保石碑，无事件画面。","d":"公元960年，后周禁军统帅赵匡胤率军北上抵御契丹，在今河南省封丘县陈桥驿被部下黄袍加身，拥立为帝，随即回师开封取代后周，建立北宋王朝。此举终结五代频繁政变局面，开启文官治国与中央集权强化的新阶段，奠定两宋三百余年基本制度框架。","q":"960年陈桥驿，历史画：赵匡胤披黄袍立于军帐前，众将校环跪拥立，旌旗与甲骑，驿舍寒林，晨雾中火光"},{"m":"中国篇","t":3,"n":"王莽改制","a":"陕西省","p":"现图为博物馆陈列，非事件场景。","d":"公元8年，王莽代汉称帝，建立新朝，随即推行以《周礼》为蓝本的全面改制，包括土地收归国有、废除奴婢、更定官制与币制、更改地名等。改制持续十余年，因脱离社会实际、政策多变、执行严苛，引发豪强抵制与民众动荡，最终激化社会矛盾。发生地今陕西省西安市。","q":"新莽长安，历史画：王莽着天子冕服立于未央宫前殿，手持周礼简册颁行新政，群臣与儒生列班，青铜鼎彝与竹简堆叠"},{"m":"中国篇","t":3,"n":"百色起义","a":"广西壮族自治区","p":"现图为纪念碑，缺少起义场面。","d":"1929年12月11日，邓小平、张云逸等在广西百色组织领导广西警备第四大队与农民自卫军举行武装起义，成立中国工农红军第七军和右江苏维埃政府，创建覆盖广西西部十余县的革命根据地，形成与中央苏区遥相呼应的西南战略支点。","q":"1929年百色，档案照片风格：邓小平、张云逸在粤东会馆前检阅红军队伍，红旗与斗笠士兵，砖木骑楼与南国街景，颗粒粗"},{"m":"中国篇","t":3,"n":"长平之战","a":"山西省","p":"现图为遗址石牌，无战场画面。","d":"公元前260年，秦赵两国在长平展开大规模会战，秦将白起采取诱敌深入、分割包围战术，围困赵军四十六日，赵括战死，四十余万赵军降卒被坑杀。赵国精锐尽丧，国力崩溃，再无力单独抗衡秦国，六国合纵抗秦局面瓦解。发生地今山西省高平市。","q":"前260年长平，历史画：秦军围困赵军于山谷，白起立于高坡指挥，赵括率残部突围中箭，旌旗倒伏、尸横遍野，黄土沟壑"},{"m":"中国篇","t":4,"n":"云冈石窟开凿","a":"山西省","p":"现图为洞窟壁画局部，缺少开凿场景。","d":"北魏文成帝和平元年（460年），高僧昙曜奉诏于平城（今山西省大同市云冈区武周山南麓）主持开凿五座大型石窟，即今云冈石窟第16至20窟；工程持续至孝文帝太和十八年（494年）迁都洛阳前，共凿窟五十三个，造像五万一千余尊；其早期“昙曜五窟”融合印度犍陀罗风格与中国传统审美，标志着佛教艺术中国化的关键转折；此处即今山西省大同市西郊云冈镇，为现存最早、规模最大的北魏皇家石窟群。","q":"北魏平城武周山，历史画：昙曜立于崖壁前指挥工匠凿佛，石屑飞扬、脚手架与铁錾，初凿的五座大窟轮廓，砂岩暖黄"},{"m":"中国篇","t":4,"n":"张献忠屠武昌","a":"湖北省","p":"现图为城市天际线，非事件画面。","d":"公元1643年十二月，张献忠部攻陷武昌府，即今湖北省武汉市武昌区。明楚王朱华奎被沉入长江，王府焚毁，城中官民遭大规模屠戮，府库被掠一空。此役使张献忠获得大量军资与战船，极大提升其水陆机动能力，为其后续转战湖南、建立大西政权奠定重要基础，亦加剧了明末长江中游统治秩序的崩解。","q":"1643年武昌，历史画：大西军攻破城门，街巷火起、百姓奔逃，张献忠骑马立于城门下，长江与城墙烽烟"},{"m":"中国篇","t":4,"n":"林爽文起义","a":"台湾省","p":"现图为庙宇建筑，无起义场面。","d":"公元1787年，福建漳州移民林爽文在台湾府凤山县（今台湾省台南市境内，清代台湾府治所在今台南市中西区，林部活动中心包括大里杙、诸罗等地，核心起义爆发地为今台南市新化区及玉井区交界之丘陵地带）聚众反清，建立大盟主国，围攻诸罗、台湾府城，清廷调集闽浙粤三省兵力耗时两年始平定；此役暴露清廷治台军事薄弱与吏治腐败，促使乾隆朝强化台湾驻军与行政管控。","q":"1787年彰化，历史画：天地会众头裹红巾持械攻县署，林爽文立于旗下，台湾竹围与稻田，硝烟与南国林木"},{"m":"中国篇","t":4,"n":"蔡文姬归汉","a":"河南省","p":"现图为纪念馆门楼，非事件画面。","d":"东汉末年，匈奴南下掳掠中原，陈留郡女子蔡琰即蔡文姬被俘至塞北，在匈奴生活十余年，后由曹操遣使以重金赎回，返回中原。事件发生地今属河南省安阳市，非广西；其归汉过程体现汉末政权对文化士人的保护意识，现存《悲愤诗》与《胡笳十八拍》为研究汉匈关系及女性书写的珍贵文本。","q":"东汉末塞北，工笔画：蔡文姬着胡服抱琵琶立于毡帐前，汉使持节相迎，胡骑与骆驼、草原朔风，面容悲欣"},{"m":"中国篇","t":5,"n":"平王东迁","a":"河南省","p":"现图为城门照，缺少东迁队伍。","d":"周平王元年（公元前770年），周平王姬宜臼在晋文侯、郑武公、秦襄公等诸侯护送下，自镐京东迁至洛邑，重建周王室统治中心。此举标志西周结束、东周开始，周王室权威衰落，诸侯争霸时代开启。洛邑此后长期作为周代政治中心。事件发生地为洛邑，今河南省洛阳市。","q":"前770年，历史画：周平王车驾与百官自镐京东行，戎骑在后、烽烟未熄，车马甲士绵延于古道，尘土漫天"},{"m":"中国篇","t":5,"n":"郭守敬出生","a":"河北省","p":"现图为纪念馆牌坊，非人物画像。","d":"南宋理宗绍定四年（1231年），郭守敬生于邢州邢台县，即今河北省邢台市信都区邢州古城内；他早年师从刘秉忠研习天文、水利、数学，元世祖忽必烈即位后受命修订历法，主持全国范围天文观测，建观星台二十七所；其编制的《授时历》以365.2425日为一回归年，与现代公历数值完全一致，领先世界三百余年；邢台达活泉公园内仍存郭守敬纪念馆及元代观星台复原模型。","q":"1231年邢台，工笔设色人物画：成年郭守敬着元式长袍立于观星台，手持浑天仪图纸，案上圭表与算筹，夜色星图"},{"m":"中国篇","t":5,"n":"陈霸先建康平叛","a":"江苏省","p":"现图为城墙照，无战斗画面。","d":"公元555年，陈霸先在建康即今江苏南京平定王僧辩余部叛乱，双方为南朝梁旧将势力与新兴军阀集团，战事集中于建康宫城及秦淮河沿线，陈霸先焚毁石头城营垒，击溃敌军主力，控制建康并为次年建立陈朝奠定基础，此役终结了梁末权臣割据局面。","q":"555年建康，历史画：陈霸先率甲士自城门突入，与叛军巷战于秦淮河畔，旗帜与楼橹，烟尘与江雾"},{"m":"中国篇","t":5,"n":"龙门石窟开凿","a":"河南省","p":"现图为景区门楼，缺少开凿场景。","d":"龙门石窟始凿于北魏孝文帝太和十七年（493年），地点位于洛阳城南伊河两岸的龙门山与香山，即今河南省洛阳市洛龙区龙门镇境内，历时四百余年续凿至唐末，现存窟龛2345个、造像10万余尊、碑刻题记2800余品，以宾阳中洞、奉先寺卢舍那大佛为代表，是北魏迁都洛阳后汉化改革与佛教中国化的重要物质见证。","q":"北魏洛阳伊阙，历史画：工匠在伊水崖壁凿刻卢舍那大佛，脚手架、石屑与锤錾，伊河舟楫与西山崖面"},{"m":"世界篇","t":4,"n":"塞瓦斯托波尔围攻","a":"Ukraine","p":"现图为要塞今貌，缺战役场面。","d":"1854年10月至1855年9月，英法联军围攻俄罗斯黑海舰队基地塞瓦斯托波尔要塞，经长达349天惨烈攻坚，最终攻克这座依托克里米亚半岛西南端天然港湾构筑的坚固堡垒。发生地今属俄罗斯克里米亚共和国塞瓦斯托波尔市，此役是克里米亚战争决定性战役，暴露沙俄军事落后，加速农奴制改革，并推动现代战地医疗与新闻报道制度诞生。","q":"1855年塞瓦斯托波尔要塞，历史油画：英法联军在马拉霍夫岗前掘壕，俄军炮台开火，硝烟与土垒，军服与刺刀，冷灰调"},{"m":"世界篇","t":4,"n":"孔雀王朝建立","a":"India","p":"现图为石柱遗迹，无即位场景。","d":"公元前322年，出身摩揭陀国贵族的旃陀罗笈多·毛利亚推翻难陀王朝统治，在恒河中游古都华氏城建立孔雀王朝，定都华氏城（今印度比哈尔邦首府巴特那市），随后驱逐希腊-巴克特里亚残余势力并统一北印度大部。此王朝为印度历史上首个幅员辽阔的中央集权帝国，阿育王时期推行佛教、修筑驿道、设立石柱诏令，奠定印度古典文明政治与文化范式基础。","q":"前321年摩揭陀华氏城，历史画：旃陀罗笈多在华氏城即位，象兵与弓手列阵，恒河与木构宫城，赭黄设色"},{"m":"世界篇","t":4,"n":"柏林会议","a":"Germany","p":"现图为会议代表旧照特写，场面不全。","d":"1878年6月至7月，俄、英、德、奥匈、法、意、奥斯曼等十三国代表在柏林召开会议，地点位于今德国柏林。会议旨在修订俄土战争后签订的《圣斯特凡诺条约》，重点调整巴尔干地区领土安排。德国首相俾斯麦担任调停人，英国获得塞浦路斯，奥匈帝国获波黑行政权，保加利亚被划分为三部分。会议确立列强对奥斯曼属地的共管机制，强化了欧洲协调体系，也埋下巴尔干民族矛盾激化的隐患。","q":"1884年柏林首相府会议厅，档案照片风格：俾斯麦坐于长桌主位，各国使节围坐，非洲地图摊开，煤气灯与深色礼服"},{"m":"世界篇","t":4,"n":"格拉纳达陷落","a":"Spain","p":"现图为阿尔罕布拉外观，无受降场景。","d":"1492年1月2日，天主教双王斐迪南与伊莎贝拉率领卡斯蒂利亚-阿拉贡联军攻陷格拉纳达埃米尔国最后据点阿尔罕布拉宫；末代苏丹穆罕默德十二世投降，结束持续近八个世纪的收复失地运动；今该城属西班牙安达卢西亚自治区格拉纳达市；此举完成伊比利亚半岛基督教统一，强化中央集权，随即启动对美洲的跨洋扩张，深刻改变世界历史走向。","q":"1492年格拉纳达，历史画：天主教双王军队入城，摩尔末代君主献出城门钥匙，阿尔罕布拉红堡与雪山，旗帜招展"},{"m":"世界篇","t":4,"n":"胡志明战役","a":"Vietnam","p":"现图为纪念碑，非战役现场。","d":"1975年4月26日至30日，越南人民军集中兵力对南越首都西贡发起总攻，经四天巷战突破防线，于30日攻占独立宫，南越总统杨文明投降。发生地今属越南胡志明市（原西贡），此役终结越南战争，实现国家统一，标志冷战时期亚洲民族解放运动重大胜利，同时引发东南亚难民潮与区域安全格局重组，深刻影响亚太地缘战略走向。","q":"1975年4月西贡，档案照片风格：北越坦克撞开独立宫铁门，士兵冲入庭院，街头民众围观，硝烟与棕榈"},{"m":"世界篇","t":4,"n":"莱茵河战役","a":"Germany","p":"现图为河岸今貌，缺渡河场面。","d":"1945年3月，盟军在德国科隆附近的莱茵河发起强渡作战，美军第三集团军率先在雷马根夺取鲁登道夫大桥，随后英美加等国部队多点突破，迅速向德国腹地推进，战役导致纳粹德国西部防线彻底崩溃，为柏林战役铺平道路。","q":"1945年3月雷马根，档案照片风格：美军步兵跨过鲁登道夫大桥残骸，浮桥与渡船，河面烟幕，士兵背负装备"},{"m":"世界篇","t":4,"n":"阿根廷独立宣言签署","a":"Argentina","p":"现图为雕像，非签署场景。","d":"1816年7月9日，拉普拉塔联合省各省代表在图库曼圣弗朗西斯科修道院召开大会，通过《独立宣言》，正式宣布脱离西班牙殖民统治，成立独立主权国家。发生地今属阿根廷图库曼省图库曼市，此举虽未立即结束军事斗争，却为后续组建中央政府、制定宪法及确立阿根廷国家身份提供法理基石，被视为阿根廷建国起点与拉美独立运动重要里程碑之一。","q":"1816年图库曼，历史画：议会厅内代表签署独立宣言，长桌烛台，蓝白旗与礼袍，拱廊与木梁"},{"m":"世界篇","t":5,"n":"拿破仑流放厄尔巴岛","a":"Italy","p":"现图为海岛航拍，无人物场景。","d":"1814年4月11日，战败退位的法兰西第一帝国皇帝拿破仑·波拿巴在枫丹白露条约签署后被流放至地中海第勒尼安海中的厄尔巴岛，以该岛为独立公国统治者身份居住近十个月；其驻跸地波尔托费拉约今属意大利共和国托斯卡纳大区里窝那省厄尔巴岛市镇，岛上设防军营与行政机构均保留完整，此次流放成为拿破仑复辟“百日王朝”的地理跳板与政治伏笔。","q":"1814年厄尔巴岛，历史画：拿破仑戴双角帽披灰大衣在码头登陆，护卫与当地居民，地中海岩岸与帆船"},{"m":"世界篇","t":5,"n":"英国内战爆发","a":"United Kingdom","p":"现图为教堂建筑，无事件画面。","d":"1642年8月22日，英格兰国王查理一世在诺丁汉城堡升起王旗，宣布讨伐议会派，标志英国内战全面爆发；王军与议会军在此后四年间于英格兰、威尔士及苏格兰多地交战，诺丁汉今属英国英格兰东米德兰兹区域诺丁汉郡，此事件终结都铎以来君主专制惯性，催生世界上首个资产阶级共和国（1649–1660），深刻重塑英国宪政体制与社会结构。","q":"1642年诺丁汉，历史画：查理一世竖起王旗，骑士军与议会军对峙，城堡与秋野，旗帜与甲胄"}];
const tb=document.getElementById("tb");
function render(f){
  const q=(f||"").trim().toLowerCase();
  tb.innerHTML=D.filter(d=>!q||d.n.toLowerCase().includes(q)||(d.a||"").toLowerCase().includes(q)||d.q.toLowerCase().includes(q)||d.d.toLowerCase().includes(q))
   .map(d=>`<tr><td>${d.m}</td><td>${d.t}★</td><td class="n">${d.n}</td><td>${d.a||"—"}</td>
   <td class="p">${d.p}</td><td class="d">${d.d}</td><td class="q">${d.q}</td></tr>`).join("");
}
document.getElementById("q").addEventListener("input",e=>render(e.target.value));
render("");
</script></body></html>
