<script>
const D=[{"m":"中国篇","t":1,"n":"九一八事变","a":"辽宁省","p":"现图为苏联风格宣传画（母子与士兵），与事件无关。","d":"1931年9月18日夜，日本关东军炸毁沈阳北郊柳条湖附近南满铁路一段路轨，反诬中国军队所为，随即进攻北大营并占领沈阳城，数月内控制辽宁、吉林两省大部，东北全境沦陷，中国局部抗战由此开始，东北抗日联军随后在白山黑水间展开长期游击战。","q":"1931年9月18日夜沈阳北大营，黑白档案照片：柳条湖铁路段被炸的枕木与铁轨扭曲，日军步兵端枪越过铁路路基，探照灯与硝烟，颗粒粗、边缘泛黄"},{"m":"中国篇","t":1,"n":"五四运动","a":"北京市","p":"现图是工业机械飞轮，与事件无关。","d":"1919年5月4日，北京大学等十三所高校学生三千余人在天安门前集会游行，抗议巴黎和会将德国在山东权益转让日本，地点即今北京市东城区天安门广场北侧。游行队伍转赴东交民巷使馆区受阻后转向赵家楼，痛殴章宗祥并火烧曹汝霖宅。运动推动新文化思潮传播与工人阶级登上政治舞台。","q":"1919年5月4日北京天安门广场，黑白档案照片：数千名学生举横幅游行，长衫与西式学生装混杂，警察持棍列队对峙，旗帜与人群纵深，颗粒粗"},{"m":"中国篇","t":1,"n":"圆明园被焚","a":"北京市","p":"现图是蒸汽机齿轮，与事件无关。","d":"1860年10月6日至18日，英法联军攻陷北京，劫掠圆明园珍宝后，为掩盖罪行并迫使清廷屈服，于10月18日纵火焚烧圆明园，大火持续三日，园林建筑、典籍、文物尽数化为焦土。焚毁地点位于今北京市海淀区清华西路28号圆明园遗址公园范围内，地处西郊皇家园林群核心，此举是近代中国主权沦丧与文明浩劫的象征性事件，加速清廷半殖民地化进程，亦激发国人救亡图存意识觉醒与文化保护自觉。","q":"1860年10月北京圆明园西洋楼，历史油画：大水法残存的巴洛克石柱与断壁，英法联军士兵搬运铜器与绸缎，远处浓烟冲天，冷灰暖橙对比"},{"m":"中国篇","t":1,"n":"大泽乡起义","a":"安徽省","p":"现图是英文标注的战役路线图。","d":"秦二世元年七月，陈胜吴广率九百戍卒赴渔阳途中因大雨滞留今安徽省宿州市大泽乡，依秦律误期当斩，遂揭竿而起，自称将军，建立张楚政权，攻占陈县后陈胜称王，发布反秦檄文，起义虽三个月后因内部分裂与秦军反扑而失败，却首开秦末大规模反秦浪潮，直接促成项羽刘邦等势力相继崛起。","q":"秦二世元年大泽乡，历史画：暴雨中的沼泽旷野，九百戍卒持木棍锄头立于泥泞中，陈胜吴广振臂高呼，囚服与竹简诏书散落，铅灰雨幕"},{"m":"中国篇","t":1,"n":"官渡之战","a":"河南省","p":"现图是现代建筑入口照。","d":"公元200年，曹操率军约两万与袁绍十余万大军在官渡展开战略决战，曹军焚毁袁军囤积于乌巢的粮草，乘势反攻大破袁军主力。战场位于今河南省郑州市中牟县东北部官渡镇一带，地处黄河南岸冲积平原，是东汉末年北方最具决定性的战役；此战使曹操基本统一黄河中下游地区，奠定曹魏立国根基，深刻影响三国鼎立格局形成进程。","q":"公元200年官渡，历史画：袁绍大军连营与土山望楼在黑夜里被火攻，曹操轻骑持火把突入粮囤，粮车焚毁、浓烟与旌旗，土黄赭石设色"},{"m":"中国篇","t":1,"n":"戊戌变法","a":"北京市","p":"现图是一人在池塘撑船。","d":"1898年6月11日至9月21日，光绪帝在康有为、梁启超等维新派推动下颁布《明定国是诏》，推行包括废八股、设京师大学堂、裁冗官、练新军等百余项改革措施，历时一百零三天；慈禧太后于9月21日发动政变，囚禁光绪，捕杀谭嗣同等六君子。变法中枢位于今北京市西城区中南海及故宫博物院养心殿区域，虽告失败却首次系统提出君主立宪构想，启蒙现代政治思想，为辛亥革命积蓄思想力量与人才储备。","q":"1898年北京紫禁城，历史画：光绪帝在书房召见康有为、梁启超，长案摊开奏折与《时务报》，殿内烛火与朱漆廊柱，君臣神情凝重"},{"m":"中国篇","t":1,"n":"赤壁之战","a":"湖北省","p":"现图是京剧舞台剧照。","d":"东汉建安十三年，曹操率北方军队南下，孙权与刘备联军在长江赤壁一带迎战，战场位于今湖北省赤壁市西北长江南岸。联军利用火攻战术，趁东南风起时以蒙冲斗舰载薪草灌油纵火，烧毁曹军连环战船。曹操战败北撤，三国鼎立格局由此初步形成。","q":"公元208年赤壁江面，历史画：连环战船燃起大火，东吴艨艟借东南风突入，周瑜黄盖立于楼船指挥，江雾与火光交织，青绿赭石重彩"},{"m":"中国篇","t":1,"n":"郑和下西洋","a":"江苏省","p":"现图是带大段文字的展板。","d":"1405年7月11日，明成祖朱棣派遣郑和率领由二百四十多艘海船、二万七千余名官兵组成的庞大船队，自南京龙江关启航远航西洋，首航经占城、爪哇至古里返航；此后二十八年间七下西洋，最远抵达东非海岸与红海入口。始发地今属江苏省南京市鼓楼区下关街道龙江宝船厂遗址片区，此举开创人类航海史上空前规模远洋活动，促进中外政治交往、经贸往来与技术传播，彰显明代前期中国海洋实力与和平外交理念。","q":"1405年太仓刘家港，历史画：九桅宝船列阵出港，郑和着宦官蟒袍立于船首，水手攀索扬帆，岸上仪仗与旗帜，海天开阔，工笔重彩"},{"m":"中国篇","t":1,"n":"飞夺泸定桥","a":"四川省","p":"现图为带字幕的海报式画面。","d":"一九三五年五月，中央红军长征途经今四川省甘孜藏族自治州泸定县大渡河畔，面对敌军拆毁桥板、重兵把守的十三根铁索桥，红四团官兵攀索冒火突击，当日夺取桥头阵地，保障主力部队安全渡河，避免重蹈石达开覆辙，成为红军突破天险的关键节点。","q":"1935年5月泸定桥，历史油画：十三根铁索横跨大渡河，红军突击队攀索匍匐前进，桥板焚毁、对岸碉堡喷火，江水翻腾，冷灰与火光对比"},{"m":"中国篇","t":2,"n":"澶渊之盟","a":"河南省","p":"现图是景区蜡像情景剧照。","d":"北宋景德元年，辽圣宗与萧太后率军深入至澶州北城，即今河南省濮阳市城区北部，宋真宗在寇准力促下亲征，宋军射杀辽将萧挞凛，双方在澶州城下达成和议，宋辽约为兄弟之国，宋岁输银绢，划定白沟河为界，形成百年和平局面","q":"1005年澶州北城，历史画：宋真宗在城楼黄罗伞下接受辽使盟书，寇准按剑立于侧，城下辽军骑阵与使节车驾，冬日灰蓝天色，绢本设色"},{"m":"中国篇","t":2,"n":"荆轲刺秦王","a":"陕西省","p":"现图是刻满文字的石碑。","d":"公元前227年，燕国太子丹派荆轲携樊於期首级与督亢地图赴咸阳刺杀秦王嬴政。荆轲在咸阳宫献图时图穷匕见，追刺未中，被侍卫所杀。事件发生于秦都咸阳，即今陕西省咸阳市渭城区境内。刺杀失败加速秦国对燕国的征伐，次年秦军攻破燕都蓟城。此事成为秦统一过程中标志性反抗事件。","q":"公元前227年咸阳宫，历史画：荆轲展图穷而匕首现，左手把秦王衣袖，秦王绕柱拔剑，群臣惊乱无兵器，铜柱与竹简散落，深褐金线重彩"},{"m":"中国篇","t":2,"n":"靖康之变","a":"河南省","p":"现图是田野里的石像生。","d":"一一二七年，金军攻破北宋都城汴京（今河南省开封市），俘虏宋徽宗、宋钦宗及皇室宗亲、朝臣数千人北去，北宋灭亡，赵构南逃建立南宋，中原士民大规模南迁，理学思想加速传播，宋代城市文化重心由开封转向临安，开封府自此失去首都地位。","q":"1127年汴京，历史画：金军骑兵押解宋徽钦二帝与宗室北行，宫门焚毁、宗庙礼器被车载走，百姓伏地哭送，冬雪与灰黄天色"},{"m":"中国篇","t":2,"n":"黄巾起义","a":"河北省","p":"现图是荒草中的残石，指认不出地点。","d":"东汉灵帝光和七年（公元184年），张角以巨鹿郡为策源地发动黄巾起义，核心起事区域在今河北省邢台市巨鹿县西南古漳河流域；其以太平道组织信徒数十万，头裹黄巾为标识，提出“苍天已死，黄天当立”口号；虽在九个月内遭皇甫嵩等镇压，但动摇东汉统治根基，引发群雄割据；邢台地处华北平原腹地，汉代为冀州重镇，此次大规模宗教性农民战争在此爆发，凸显其在东汉末年社会矛盾激化中的特殊地位。","q":"184年巨鹿，历史画：头裹黄巾的农民军持锄镰竹矛攻向县城城门，张角三兄弟立于土台举旗，黄旗如海、尘烟弥漫，赭黄主调"},{"m":"中国篇","t":3,"n":"七国之乱","a":"河南省","p":"现图是英文标注的政区图。","d":"公元前154年，吴王刘濞联合楚、赵等六国诸侯以“清君侧”为名起兵反汉，主力在梁国睢阳受阻，周亚夫率汉军断其粮道，三月后叛乱平定。主战场睢阳即今河南省商丘市睢阳区。七国之乱失败标志诸侯割据势力衰落，中央集权强化。","q":"公元前154年睢阳城下，历史画：吴楚联军蚁附攻城，梁军据城放箭，周亚夫轻骑自侧翼突袭粮道，旌旗与云梯，土黄冷灰设色"},{"m":"中国篇","t":3,"n":"三藩之乱","a":"云南省","p":"现图是英文标注的清代疆域图。","d":"公元1673年，平西王吴三桂在今云南省昆明市宣布反清，联合靖南王耿精忠、平南王尚可喜之子尚之信起兵，战火遍及南方十余省。清廷历时八年平定叛乱，废除三藩，强化中央对西南控制，确立满洲贵族对全国的稳固统治。","q":"1673年昆明，历史画：吴三桂着明代式甲胄在五华山宫前誓师，将弁环立举刀，旗帜书「周」字，滇池远山与阴云，工笔重彩"},{"m":"中国篇","t":3,"n":"党锢之祸","a":"河南省","p":"现图是博物馆大门，与事件无关。","d":"东汉桓帝、灵帝时期，士大夫集团与宦官集团在洛阳激烈冲突，多次发生禁锢清议士人的事件，李膺、范滂等名士被诬下狱或处死，太学生千余人受牵连遭禁锢，朝廷威信严重受损，士人离心加剧，政治生态持续恶化，为后来黄巾起义爆发埋下深层社会伏笔。","q":"166年洛阳太学，历史画：太学生与士人列跪于宫阙前，宦官持诏捕人，党人枷锁相连、衣冠散乱，汉阙与柏树，青灰冷调"},{"m":"中国篇","t":3,"n":"大运河开通","a":"江苏省","p":"现图是现代雕塑，与隋代运河无关。","d":"隋大业元年（605年），隋炀帝征发河南、淮北百余万民夫开凿通济渠，自洛阳西苑引谷洛水入黄河，再疏汴渠连淮水，贯通洛阳至扬州段，扬州即今江苏省扬州市广陵区，作为运河终点枢纽与江南经济中心，该工程使南北漕运效率倍增，促成唐宋经济重心南移，奠定此后六百年中国交通与财政命脉基础。","q":"605年洛阳通济渠，历史画：隋炀帝龙舟与纤夫队列沿河而下，民夫掘土挑担、堤岸插柳，漕船成列，赭黄与石绿设色"},{"m":"中国篇","t":3,"n":"夷陵之战","a":"湖北省","p":"现图是英文标注的战役图。","d":"公元221至222年，刘备为夺回荆州并报关羽被杀之仇，亲率数万大军东征孙权，双方在猇亭至夷道一线（今湖北宜昌宜都、猇亭一带）长期对峙，陆逊坚守不出后寻机以火攻破蜀军连营四十余座；蜀汉精锐尽丧，将领黄权降魏，刘备退守白帝城不久病逝，此战彻底奠定三国鼎立格局。","q":"222年夷陵，历史画：蜀军连营七百里于山林被火攻，陆逊吴军持火把沿江突进，刘备车驾退走，江雾与赤焰，青绿重彩"},{"m":"中国篇","t":3,"n":"岳飞出生","a":"河南省","p":"现图是文物保护单位石牌，指认不出事件。","d":"北宋元祐八年（1103年），岳飞生于相州汤阴县永和乡孝悌里，即今河南省安阳市汤阴县程岗村，其父岳和务农持家，母姚氏刺字训子，少年习武读《左氏春秋》，后应募从军抗金，汤阴作为岳飞故里与早期成长地，见证了其忠勇品格形成过程，亦为南宋中兴名将精神原乡的重要地理坐标。","q":"1103年相州汤阴，工笔设色人物画：青年岳飞着布袍立于庭院，手按长枪、背负弓矢，岳母刺字场景在侧，北宋民居与枣树，暖褐调"},{"m":"中国篇","t":3,"n":"巨鹿之战","a":"河北省","p":"现图为陕西的遗址石牌，地点不对（应为河北平乡）。","d":"秦二世三年项羽率楚军与秦将章邯、王离所部在巨鹿展开决战，战场位于今河北省平乡县西南。项羽破釜沉舟激励士气，以少击众大败秦军主力，俘王离、逼降章邯。此战摧毁秦朝军事支柱，加速秦朝灭亡，确立项羽在反秦联军中的主导地位。平乡县巨鹿古战场遗址纪念碑与麦田交错","q":"公元前207年巨鹿，历史画：项羽军凿沉渡船、砸破釜甑于漳水岸边，楚军持戈渡河，秦军壁垒在望，河滩泥泞与残阳"},{"m":"中国篇","t":3,"n":"昆阳之战","a":"河南省","p":"现图是平顶山博物馆现代建筑。","d":"公元23年，绿林军与王莽新朝四十二万主力在昆阳展开决战，战场位于今河南省平顶山市叶县境内；刘秀率十三骑突围求援，随后率援军内外夹击，以少胜多击溃王莽军，主将王寻被杀；此战导致新朝军事力量崩溃，朝廷威信扫地，绿林军不久攻入长安，王莽被杀，新朝灭亡。","q":"23年昆阳，历史画：暴雨中刘秀率三千敢死队冲击王莽大军，陨石与狂风、滍水暴涨淹没莽军，旌旗倒伏，墨青与雷电白"},{"m":"中国篇","t":3,"n":"林则徐出生","a":"福建省","p":"现图是现代城市河景。","d":"清乾隆五十年（1785年），林则徐生于福建侯官县左营司巷，即今福建省福州市鼓楼区中山路林则徐出生地纪念馆所在地，其父林宾日为私塾教师，家境清寒而重教育，林则徐二十岁中举，后主持禁烟运动、编译《四洲志》，福州作为其成长与早期仕宦起点，承载其经世致用理念萌发的关键地理语境。","q":"1785年福州侯官，工笔设色人物画：成年林则徐着清代青衫、戴瓜皮小帽端坐鳌峰书院窗下，手执《四书》与奏稿，案置砚台茶盏，闽中粉墙黛瓦与榕荫"},{"m":"中国篇","t":3,"n":"永乐迁都","a":"北京市","p":"现图是北京 CBD 天际线。","d":"公元1421年，明成祖朱棣正式将明朝首都从应天府迁至北京顺天府，以北京为京师，南京为留都。迁都发生于今北京市中心区域，伴随紫禁城、太庙、社稷坛等核心建筑群落成，确立北京作为此后五百余年全国政治中心的地位。","q":"1421年北京，历史画：紫禁城三大殿落成大典，朱棣衮冕立于奉天门，百官朝贺、仪仗卤簿绵延，琉璃瓦与朱墙，界画工笔"},{"m":"中国篇","t":3,"n":"沙丘之变","a":"河北省","p":"现图为不明石构，指认不出事件。","d":"公元前210年，秦始皇巡游途中病逝于沙丘平台，赵高与李斯秘不发丧，以鲍鱼掩盖尸臭，篡改遗诏赐死公子扶苏与蒙恬，立胡亥为帝；沙丘平台位于今河北省邢台市广宗县境内；政变导致秦帝国继承危机激化，宗室猜忌加深，地方离心加剧，埋下速亡伏笔。","q":"公元前210年沙丘平台，历史画：赵高与李斯在沙丘行宫密谋，烛火下改易始皇遗诏，竹简与玺印摊于案，帷幔低垂，暗褐冷调"},{"m":"中国篇","t":3,"n":"牧野之战","a":"河南省","p":"现图是暗色展陈屏，看不出事件。","d":"周武王联合诸侯伐纣，在牧野与商军决战，战场位于今河南省淇县南卫河以北。周军趁商军阵前倒戈之机迅速突破，纣王兵败自焚于鹿台。商朝终结，周朝建立，分封制与宗法制由此确立。淇县朝歌遗址公园内断续夯土墙基与苍松","q":"公元前1046年牧野，历史画：周武王战车阵列与商军奴隶阵前倒戈，戈矛如林、旌旗蔽野，牧野平原与晨雾，青铜纹样边框"},{"m":"中国篇","t":3,"n":"甲骨文出土","a":"河南省","p":"现图是石构，看不出甲骨。","d":"清光绪二十五年（1899年），北京官员王懿荣因患疟疾购得含奇异刻符的“龙骨”，辨识出甲骨文为商代文字，追查源头至河南安阳小屯村，即今河南省安阳市殷都区小屯村，此处为商代晚期都城殷墟核心，此后百年出土甲骨十五万片以上，证实《史记·殷本纪》记载可信，奠定中国信史时代起始坐标。","q":"1899年安阳小屯，历史画：村人翻掘黄土掏出龟甲牛骨，学者在油灯下拓印卜辞，土坑旁堆满骨片与拓包，赭黄与墨色"},{"m":"中国篇","t":3,"n":"白起拔郢","a":"湖北省","p":"现图是荆州博物馆现代建筑。","d":"公元前278年，秦国名将白起率军攻破楚国都城郢都，焚毁夷陵，驱逐楚顷襄王，占领江汉平原核心区域。秦军深入楚境数百里，夺取大片领土并设南郡，楚国被迫东迁至陈城，丧失西部根基与战略主动权。此役极大削弱楚国实力，加速秦国统一进程。发生地今湖北省荆州市。","q":"公元前278年郢都，历史画：秦军云梯攻上楚都城墙，白起立于战车指挥，楚王车驾东逃、宗庙火起，江汉水网与浓烟"},{"m":"中国篇","t":3,"n":"秦始皇兵马俑出土","a":"陕西省","p":"现图是带水池的仿古建筑，不是兵马俑。","d":"1974年3月，陕西省临潼县西杨村农民打井时发现陶俑残片，经考古队发掘确认为秦始皇陵陪葬坑，出土兵马俑千余件及战车、兵器等，坑址位于今陕西省西安市临潼区秦始皇陵封土以东1.5公里处，属秦代京畿要地，此次发现改写世界对秦代军事制度、雕塑工艺与集权体制认知，成为20世纪中国最重要考古成果之一。","q":"1974年临潼，档案照片风格：考古人员在探方中清理陶俑，陶马与武士俑半露于黄土，毛刷与测量绳，颗粒粗、色调土黄"},{"m":"中国篇","t":3,"n":"鄢陵之战","a":"河南省","p":"现图是刻满文字的石牌。","d":"公元前575年，晋楚两国为争夺中原霸权，在今河南省鄢陵县境内的鄢陵展开决战，晋军利用晨雾掩护布阵，击溃楚军左翼，楚共王中箭负伤退兵。此战后楚国北进势头受挫，晋国重掌诸侯盟主之位，中原诸国多倾向晋方，弭兵之会由此酝酿。","q":"公元前575年鄢陵，历史画：晋楚两军战车在沼泽边交错，楚共王中箭、晋将魏锜引弓，战马陷泥、旌旗歪斜，暮色烟尘"},{"m":"中国篇","t":3,"n":"长勺之战","a":"山东省","p":"现图是现代公园大门带汽车。","d":"公元前684年，齐国攻鲁，两军在今山东省莱芜区东北的长勺交战，鲁国曹刿辅佐鲁庄公采用后发制人战术，待齐军三鼓气竭后反攻取胜。此战成为早期以弱胜强的经典战例，载入《左传》，其“一鼓作气”战术思想被后世兵家反复援引分析。","q":"公元前684年长勺，历史画：鲁军按兵不动待齐军三鼓后出击，战车在丘陵间俯冲，戈矛相错、尘土飞扬，青绿设色"},{"m":"中国篇","t":3,"n":"马嵬驿兵变","a":"陕西省","p":"现图是喀斯特山水，地点完全不对。","d":"公元756年，唐玄宗逃往四川途中，禁军将士在今陕西省兴平市西郊的马嵬驿发动兵变，诛杀宰相杨国忠，逼迫玄宗赐死杨贵妃。事件发生于安史之乱初期，直接导致玄宗丧失军心与权威，太子李亨北上灵武自行即位，开启肃宗朝平叛新阶段。","q":"756年马嵬驿，历史画：禁军持戈围驿馆，陈玄礼按剑请诛，杨国忠伏尸阶下，唐玄宗立于廊下掩面，白绫与驿亭，冷灰烛光"},{"m":"中国篇","t":3,"n":"马王堆汉墓发掘","a":"湖南省","p":"现图是长沙 IFS 高楼。","d":"1972年1月，湖南省博物馆联合中国科学院考古研究所对长沙市东郊五里牌浏阳河畔的马王堆汉墓展开系统发掘；一号墓出土保存完好的西汉初期长沙国丞相利苍之妻辛追遗体，二号墓确认为利苍墓，三号墓属其子；出土帛书《老子》甲乙本、《战国纵横家书》及大量漆器、丝织品，证实今湖南省长沙市芙蓉区与雨花区交界处为西汉长沙国核心治所，极大丰富了秦汉社会史与科技史研究资料。","q":"1972年长沙马王堆，档案照片风格：考古人员垂绳下探椁室，白膏泥与木炭层剖面，棺椁与随葬器物编号牌，强闪光与胶片颗粒"},{"m":"中国篇","t":3,"n":"黄池之会","a":"河南省","p":"现图只是树林土丘。","d":"公元前482年，吴王夫差率精兵北上至今河南省封丘县东南的黄池，与晋定公争当诸侯盟主，经激烈争执后吴国获主盟权，但越国趁机攻破吴都。此会标志吴国霸业盛极而衰，越国崛起已成定局，中原权力格局开始向东南倾斜。","q":"公元前482年黄池，历史画：吴王夫差与晋定公登坛争长，诸侯甲士列于坛下，黄旗与铜鼎、盟书玉帛，秋日旷野"},{"m":"中国篇","t":3,"n":"龙场悟道","a":"贵州省","p":"现图是城市航拍天际线。","d":"明武宗正德三年（1508年），王阳明因得罪宦官刘瑾被贬为贵州龙场驿丞，在今贵州省贵阳市修文县龙场镇一带居留讲学；他于山洞中静思顿悟“圣人之道，吾性自足”，确立心即理、知行合一思想体系；此举标志阳明心学正式诞生，深刻影响明代中后期思想界及日本、朝鲜儒学发展，奠定其作为中国哲学史上与程朱理学并立的学术高峰地位。","q":"1508年贵州龙场，历史画：王阳明在石洞中夜坐悟道，篝火与岩壁、竹简摊于石案，苗岭雾气与月光，水墨设色"},{"m":"中国篇","t":4,"n":"一江山岛战役","a":"浙江省","p":"现图是现代夜景斜拉桥。","d":"1955年1月，中国人民解放军陆海空三军首次协同作战，对浙江台州椒江区以东的一江山岛发起进攻，经两天激战全歼国民党守军一千三百余人，随后迫使大陈岛守军撤往台湾，浙江沿海岛屿全部解放，标志着解放军初步具备现代化条件下的联合作战能力与两栖登陆实力。","q":"1955年1月一江山岛，档案照片风格：解放军登陆艇冲向礁石海岸，战士涉水跃下船头，空中强击机投弹、海面硝烟，颗粒粗"},{"m":"中国篇","t":4,"n":"东山岛战役","a":"福建省","p":"现图是铁路路基。","d":"1953年7月16日，中国人民解放军福建军区部队在东山岛实施防御作战，击退国民党军陆海空三军联合登陆进攻。经两天激战，歼灭敌军三千余人，击毁舰艇多艘、飞机数架，巩固东南沿海海防体系。此役是新中国成立后首次成功抗击大规模两栖登陆作战，彰显国防力量建设成效。发生地今福建省漳州市。","q":"1953年7月东山岛，档案照片风格：解放军在沙滩与礁石间架设机枪阵地，海面登陆艇与炮火水柱，战士伏地射击，颗粒粗"},{"m":"中国篇","t":4,"n":"刘裕北伐","a":"陕西省","p":"现图是英文标注的战役图。","d":"东晋义熙十三年（417年），刘裕率晋军自彭城出发，经洛阳进抵关中，攻破后秦都城长安，俘后秦主姚泓，灭后秦。此役收复长安、洛阳两京，是东晋北伐中军事成果最显著的一次。战后刘裕留子刘义真镇守，不久因内乱撤军，关中复失。事件发生地为后秦都城长安，今陕西省西安市。","q":"417年长安，历史画：刘裕部将王镇恶率水军溯渭水而上，步兵列却月阵以强弩拒魏骑，战船与车阵相接，渭水烟波"},{"m":"中国篇","t":4,"n":"壬寅宫变","a":"北京市","p":"现图是庙会独轮车与剪纸。","d":"明嘉靖二十一年（1542年），宫女杨金英等十六人于乾清宫试图用绳索勒毙明世宗朱厚熜，未遂被捕，全部处死。此事史称壬寅宫变，系明代宫廷罕见的集体行刺事件。事后世宗移居西苑，长期不理朝政，内阁权责加重，宦官势力一度受抑。事件发生地为明代皇宫乾清宫，今北京市东城区。","q":"1542年紫禁城乾清宫，历史画：深夜寝宫内烛影，数名宫女持绳逼近御榻，帷幔与铜炉、散落簪环，冷蓝暗调，工笔重彩"},{"m":"中国篇","t":4,"n":"大小金川之战","a":"四川省","p":"现图是展柜里的刀，不是战场。","d":"乾隆年间，清廷两次出兵征讨今四川省阿坝藏族羌族自治州金川县境内土司叛乱，历时二十余年。战役发生于大渡河上游高山峡谷地带，清军耗费巨大兵力物力，最终改土归流，设厅置官，将川西北藏区纳入直接行政管辖体系。","q":"1773年金川，历史画：清军在雪山碉楼间架云梯仰攻石碉，士兵攀崖、火炮轰击，经幡与硝烟，冷灰与赭石"},{"m":"中国篇","t":4,"n":"完颜阿骨打建国","a":"黑龙江省","p":"现图是夜景中的现代大楼。","d":"公元1115年，女真首领完颜阿骨打在会宁府即今哈尔滨市阿城区东南的白城子称帝，建立大金国，年号收国；此举标志女真摆脱辽朝控制，完成部落联盟向中央集权国家的转变；金国随后发动对辽战争，十年内攻灭辽朝，深刻改变东北亚政治格局","q":"1115年按出虎水，历史画：完颜阿骨打着女真皮甲立于高台称帝，诸部首领献马与弓矢，九旄旗与毡帐，秋原与远山"},{"m":"中国篇","t":4,"n":"左宗棠收复新疆","a":"新疆维吾尔自治区","p":"现图是博物馆室内展板。","d":"公元1876年，左宗棠率清军自甘肃肃州西进，采取缓进急战策略，先后收复乌鲁木齐、吐鲁番、喀什噶尔等要地，至1878年初基本恢复除伊犁外的新疆全境；清廷随后通过外交谈判收回伊犁，1884年设立新疆行省；此举终结阿古柏入侵政权，确立清朝对天山南北的持续有效管辖","q":"1876年肃州大营，历史画：左宗棠坐镇案前阅西域舆图，湘军携抬枪火炮西进，戈壁驼队与旌旗，赭黄冷灰设色"},{"m":"中国篇","t":4,"n":"曾侯乙编钟出土","a":"江苏省","p":"现图是随州城区俯瞰。","d":"1978年5月，湖北省博物馆考古队在随县（今湖北省随州市曾都区擂鼓墩）发掘曾侯乙墓，该墓属战国早期曾国君主乙；墓中出土完整编钟共六十五件，总重达两千五百余公斤，音域跨五个半八度，十二律齐备，实证先秦礼乐制度高度发达；同时出土尊盘、冰鉴等青铜重器及竹简二百四十余枚；此发现将中国古代音乐史、冶金史与诸侯国历史研究推进至全新高度。","q":"1978年随州擂鼓墩，档案照片风格：考古人员在椁室中吊取编钟，青铜钟架与木梁、探方积水，白炽灯与胶片颗粒"},{"m":"中国篇","t":4,"n":"朱元璋取集庆","a":"江苏省","p":"现图是街头小吃摊。","d":"公元1356年，朱元璋率红巾军渡江攻占集庆路，即今江苏省南京市主城区，改名应天府；此役使其获得江南核心据点和长江下游控制权，奠定统一南方基础；此后以应天为基地推行屯田、兴学、整军，逐步形成独立于其他红巾军系统的政权实体","q":"1356年集庆，历史画：红巾军攀梯登城，朱元璋着甲立于城外旗下指挥，城头元军溃散、火起，江畔战船，土黄冷灰"},{"m":"中国篇","t":4,"n":"朱熹出生","a":"福建省","p":"现图是时装人像照，完全不对。","d":"南宋高宗建炎四年（1130年），朱熹出生于南剑州尤溪县，即今福建省三明市尤溪县水南村；他师从李侗，融汇北宋理学诸家，构建以“理气论”“格物致知”为核心的庞大哲学体系；其《四书章句集注》成为元明清科举标准教科书，主导中国思想界七百余年；尤溪南溪书院为其幼年读书处，今存朱子故居遗址与相关纪念建筑群。","q":"1130年尤溪，工笔设色人物画：朱熹着宋式深衣、戴东坡巾端坐书案，手执四书章句稿本，案置砚台与竹简，闽中书院窗棂"},{"m":"中国篇","t":4,"n":"李自成破承天","a":"湖北省","p":"现图是高速公路。","d":"公元1643年正月，李自成农民军攻克承天府，即今湖北省钟祥市。明廷在此设兴王府，为嘉靖帝故里，城防较备且存有大量仓储物资。李自成军破城后处死留守官员，收缴府库，获得战略补给与政治象征资本，此举显著提升其号召力，为其随后称“新顺王”及挥师北上、终结明朝统治埋下伏笔。","q":"1643年承天，历史画：大顺军架云梯攻承天府城墙，李自成骑白马持令旗，守军溃逃、城门火起，汉水堤岸与烟尘"},{"m":"中国篇","t":4,"n":"桓温北伐","a":"陕西省","p":"现图是英文标注的战役图。","d":"东晋永和十年（354年），桓温率步骑四万自江陵北伐前秦，经武关入关中，在蓝田大破前秦军，进至灞上，逼近长安。前秦主苻健坚壁清野，晋军粮尽退兵。此役虽未克长安，但重创前秦，彰显东晋北伐实力。事件发生地为前秦都城长安，今陕西省西安市。","q":"354年长安灞上，历史画：桓温晋军列阵于灞水西岸，关中百姓携壶浆迎军，前秦骑兵在对岸列阵，柳堤与远山"},{"m":"中国篇","t":4,"n":"王安石出生","a":"江西省","p":"现图是现代馆舍建筑。","d":"北宋真宗天禧五年（1021年），王安石生于江南西路抚州临川县，即今江西省抚州市临川区邓家巷；他二十二岁中进士，历任地方官多年，后两度拜相推行变法；其主导的熙宁变法涉及青苗、均输、保甲等十余项制度革新，虽因阻力巨大而未能彻底成功，却深刻推动宋代财政军事改革思潮，其《临川先生文集》亦开宋诗新风，使临川成为北宋文化重镇之一。","q":"1021年临川，工笔设色人物画：王安石着宋式圆领袍端坐书斋，手执言事书草稿，案头烛台与茶盏，窗外修竹"},{"m":"中国篇","t":4,"n":"班超投笔从戎","a":"河南省","p":"现图是洛阳博物馆大门。","d":"东汉永平年间，班超在洛阳官府抄写文书时掷笔感叹大丈夫当立功异域，随即投笔从戎，加入窦固北征匈奴的部队。他凭借过人胆识与外交才能出使西域，以智勇安抚鄯善、于阗、疏勒等国，重建汉朝对西域的管辖体系，开启经营西域长达三十年的生涯，成为汉代边疆经略的典范人物。","q":"73年洛阳，历史画：班超在兰台案前掷笔而起，同僚惊视，窗外胡商驼队经过，竹简与笔砚散落，汉阙与黄沙色调"},{"m":"中国篇","t":4,"n":"花木兰从军","a":"安徽省","p":"现图是现代祠庙建筑。","d":"公元400年前后，北魏时期北方边镇征兵频繁，谯郡蒙城县（今安徽省亳州市谯城区东南部）女子花木兰代父从军，隶属北魏边防军系统，参与对柔然作战十余年，功成后拒受尚书郎之职而归乡；其事迹最早见于北朝民歌《木兰诗》，虽细节难考，但折射出北魏兵制下平民家庭承担军事义务的真实状态及性别角色的弹性空间。","q":"北魏黄河岸边，历史画：木兰着明光铠、束发戴兜鍪，于军帐前接过长枪，战马与旌旗、营火，雪原枯林，工笔重彩"},{"m":"中国篇","t":5,"n":"俺答汗围北京","a":"北京市","p":"现图是穿蒙古袍的儿童。","d":"1550年秋，蒙古土默特部首领俺答汗率军突破长城防线，兵临今北京市区外围，明廷紧急闭门固守，俺答军在京畿周边劫掠八日后退兵，此事直接促使明朝重启与蒙古的通贡谈判，十余年后达成隆庆和议，开放马市并授予俺答汗王爵。","q":"1550年北京城外，历史画：蒙古土默特骑兵列于德胜门外，俺答汗坐于帐前，明军登城列守、烽燧举火，秋日尘沙与灰蓝天"},{"m":"中国篇","t":5,"n":"关汉卿出生","a":"山西省","p":"现图是寺庙鬼像特写。","d":"关汉卿约于公元1234年出生于河东解州，即今山西省运城市盐湖区一带，为元代杂剧奠基人与核心作家，其创作活动集中于大都（今北京）等地，代表作《窦娥冤》《救风尘》深刻反映社会现实，推动北曲杂剧艺术成熟定型，对后世戏曲发展影响深远，是中华文化史上承前启后的关键人物。","q":"1234年解州，工笔设色人物画：关汉卿着元式交领长袍、戴幞头，坐于书案后执笔写杂剧，案上散落曲本与琵琶，勾栏帷幕背景"},{"m":"中国篇","t":5,"n":"刘整降元献策","a":"四川省","p":"现图是城市夜景天际线。","d":"南宋宝祐九年（1261年），泸州知州刘整因受贾似道排挤，率所部精锐水军及十三万军民降于蒙古，献攻宋方略，尤其强调先取襄阳以断长江中游，加速元朝水军建设与战略转向，其叛降直接促成元军十年后攻克襄阳，泸州即今四川省泸州市江阳区，此举成为南宋防御体系崩溃的关键转折点。","q":"1261年泸州，历史画：刘整在元军大帐中向忽必烈献襄阳攻取之策，案上摊开汉水舆图与蜡丸密信，烛火与甲胄，冷褐调"},{"m":"中国篇","t":5,"n":"刘福通红巾军颍州起义","a":"安徽省","p":"现图是公园水景。","d":"元至正十一年刘福通在颍州发动红巾军起义，参与方为白莲教徒与元朝地方官军，发生地在今江苏省阜阳市颍州区老城一带；起义军以红巾为号，焚官府、释囚徒，迅速席卷淮北；成为元末大规模民变的开端，加速元朝统治崩溃。阜阳市颍州区文峰塔西侧颍河故道淤泥滩芦苇丛生秋阳淡黄写实摄影风格","q":"1351年颍州，历史画：头裹红巾的农民军持锄镰竹枪在颍州城下集结，刘福通立于土台举旗誓师，香案与旗幡，赭红主调"},{"m":"中国篇","t":5,"n":"召陵之盟","a":"河南省","p":"现图是黄昏湖面。","d":"公元前656年，齐桓公率齐、鲁、宋、陈、卫等八国联军南下至今河南省漯河市召陵区，逼迫楚国订立盟约，楚国承认周王室权威并停止北侵。此盟是春秋首次由诸侯主导、不依赖周天子名义的多国政治协调，齐桓公霸业达到顶峰，中原秩序暂得维系。","q":"公元前656年召陵，历史画：齐桓公与楚使屈完登坛盟誓，齐军车阵与楚军舟师分列两侧，旌旗与牺牲礼器，秋原旷野"},{"m":"中国篇","t":5,"n":"哱拜宁夏之乱","a":"宁夏回族自治区","p":"现图是现代广场雕塑。","d":"1592年，原蒙古降将哱拜联合宁夏巡抚党馨等官员在今宁夏回族自治区银川发动叛乱，占据宁夏镇城，明廷调集陕甘川三省兵力围攻半年，最终攻克城池，哱拜自焚，其子被俘处决，朝廷随后废除宁夏总兵世袭制，改由文官督理边务。","q":"1592年宁夏镇，历史画：哱拜部叛军据城，明军架云梯攻城、火炮轰塌城墙，黄河灌城水势，烟尘与雪泥"},{"m":"中国篇","t":5,"n":"国人暴动","a":"陕西省","p":"现图是民国合影老照片。","d":"西周厉王时期，都城镐京民众因不堪王室垄断山林川泽之利及高压统治，发动暴动驱逐周厉王，地点在今陕西省西安市长安区西北部镐京遗址区域，此后出现“共和行政”十四年。这是中国史籍明确记载的首次大规模平民政治行动。","q":"公元前841年镐京，历史画：国人持耒耜与棍棒围住王宫，周厉王在甲士护卫下乘车出奔，宫门与青铜礼器、鼎彝翻倒，灰褐冷调"},{"m":"中国篇","t":5,"n":"姑臧之战","a":"甘肃省","p":"现图是荒路铁门。","d":"公元439年，北魏太武帝拓跋焘率军围攻北凉都城姑臧，今甘肃省武威市凉州区。北凉王沮渠牧犍拒降，魏军断其水源并攻破外城，沮渠牧犍出降，北凉灭亡。此役标志北魏统一中国北方，结束十六国割据局面，河西走廊自此纳入北魏直接管辖。","q":"439年姑臧，历史画：北魏军断水围城，云梯与冲车抵近城墙，北凉守军溃散，祁连山雪线与戈壁尘沙，冷黄调"},{"m":"中国篇","t":5,"n":"左宗棠出生","a":"湖南省","p":"现图只有屋瓦天空。","d":"左宗棠于1812年出生于湖南长沙府湘阴县，即今湖南省岳阳市湘阴县樟树镇柳家冲，晚清军事家、政治家与洋务派代表人物，咸丰二年举人，率楚军平定太平军、捻军及陕甘回变，1875年受命督办新疆军务，收复除伊犁外全部失地，1884年促成新疆建省，强化西北边疆治理，其屯田、植柳、兴学举措至今留有深刻地理人文印记。","q":"1812年湘阴，工笔设色人物画：左宗棠着清式长衫坐于书斋，案上摊开舆图与《读史方舆纪要》，窗棂外洞庭烟波"},{"m":"中国篇","t":5,"n":"朵颜三卫内附","a":"内蒙古自治区","p":"现图是街边店铺。","d":"明成祖永乐元年朵颜三卫首领率部归附明朝，参与方为蒙古兀良哈部与明朝中央政权，发生地在今内蒙古自治区赤峰市北部草原地带；明廷授其首领都督等职，允许游牧于大宁以北，同时设卫所羁縻管理；此举使明朝获得东北边疆缓冲力量，稳定了对漠南蒙古的影响力。赤峰市翁牛特旗乌丹镇北山岗上朵颜卫古城遗址断墙残垣斜阳暖金写实摄影风格","q":"1403年大宁，历史画：兀良哈首领率部牵马携帐归附，明使持节授印，草原毡帐与明军仪仗并列，秋草与灰蓝天"},{"m":"中国篇","t":5,"n":"李鸿章出生","a":"安徽省","p":"现图是树丛水面。","d":"李鸿章于1823年出生于安徽庐州府合肥县磨店乡，即今安徽省合肥市瑶海区磨店街道，晚清重臣、淮军创建者与洋务运动核心推动者，道光二十七年进士，历任江苏巡抚、两江总督、直隶总督兼北洋通商大臣，创办轮船招商局、开平矿务局、北洋水师，主导签订《马关条约》《辛丑条约》等，深刻塑造19世纪后期中国外交与近代化路径。","q":"1823年合肥，工笔设色人物画：李鸿章着清式长袍坐于书房，手执奏折，案上洋务机器图样与自鸣钟，窗外淮上庭院"},{"m":"中国篇","t":5,"n":"柏举之战","a":"湖北省","p":"现图是绿色山谷公路。","d":"公元前506年，吴国孙武、伍子胥率军从淮河流域西进，在今湖北省麻城市西北的柏举一带突袭楚军主力，五战五捷直抵郢都。楚昭王出奔，吴军首次攻破南方大国都城，此战催生《孙子兵法》实战验证体系，楚国被迫迁都重振，吴楚关系彻底逆转。","q":"公元前506年柏举，历史画：吴军夫概率五千先锋突袭楚军大营，楚军车阵混乱、旌旗倒伏，大别山麓晨雾与尘土"},{"m":"中国篇","t":5,"n":"桂陵之战","a":"河南省","p":"现图是带红绿灯的马路。","d":"公元前354年，魏国围攻赵国邯郸，齐国派田忌、孙膑率军救赵，直趋魏都大梁，迫使魏将庞涓回援，在今河南省长垣市西北的桂陵设伏截击。魏军大败，庞涓被俘，赵都解围，齐国威望大增，孙膑所著《孙膑兵法》在此战后影响渐广。","q":"公元前354年桂陵，历史画：齐军孙膑设伏于桂陵道，田忌战车自丘陵俯冲，魏军庞涓部仓皇应战，断木与旌旗，青绿设色"},{"m":"中国篇","t":5,"n":"永嘉之乱","a":"河南省","p":"现图是挂彩旗的庙宇。","d":"公元311年，匈奴汉国军队攻陷西晋都城洛阳，俘获晋怀帝，焚毁宫室，劫掠士族，造成中原士人大量南迁。事件发生于今河南省洛阳市老城区一带，标志着西晋政权实质崩溃，北方进入十六国长期分裂时期，中原文化重心开始南移。","q":"311年洛阳，历史画：匈奴汉军攻破洛阳城门，宫室火起、宗庙礼器被掠，士民扶老携幼南逃，灰黑浓烟与冷雨"},{"m":"中国篇","t":5,"n":"烽火戏诸侯","a":"陕西省","p":"现图是广场绿植与站房。","d":"烽火戏诸侯传说发生于西周末年，周幽王为博褒姒一笑，在骊山烽燧台上多次点燃报警烽火，戏弄诸侯军队，地点在今陕西省西安市临潼区骊山北麓，导致后来犬戎入侵时诸侯不再响应，西周灭亡，该事件反映周代军事预警系统与诸侯义务的制度关联。","q":"公元前771年骊山，历史画：骊山烽燧狼烟冲天，诸侯车马自四方赶来却见褒姒立于台上而笑，周幽王在侧，山道尘烟"},{"m":"中国篇","t":5,"n":"硖石之战","a":"安徽省","p":"现图是广场上的坦克展品。","d":"公元527年，北魏将领崔延伯与李叔仁奉命在硖石，今安徽省凤台县西南硖山口，镇压南梁支持的叛军，梁军依山筑垒固守，魏军分兵夹击，焚毁其营栅，俘斩甚众，此役迅速平定淮南西部动乱，巩固了北魏对淮河中游地区的军事控制与行政管辖。","q":"527年硖石，历史画：梁军依山筑垒，魏将崔延伯率甲骑仰攻峡口，山石与淮水、旌旗与云梯，冷灰青色"},{"m":"中国篇","t":5,"n":"窦固破北匈奴","a":"新疆维吾尔自治区","p":"现图是食物特写。","d":"东汉永平十六年窦固率军西征，在天山北麓击败北匈奴主力，战场位于今新疆维吾尔自治区哈密市伊州区东部巴里坤草原一带。汉军分路出击，夺取伊吾卢屯田据点，重启西域通道。此役打破北匈奴对西域的控制，为班超经营西域奠定基础。","q":"73年蒲类海，历史画：汉军骑兵在巴里坤草原冲击北匈奴王庭，窦固立于高坡指挥，毡帐与牛羊溃散，雪山与尘沙"},{"m":"中国篇","t":5,"n":"耶律德光灭后晋","a":"河南省","p":"现图是电视塔。","d":"公元947年，辽太宗耶律德光率契丹军队南下，攻破后晋都城开封，俘虏后晋出帝石重贵，后晋灭亡；契丹军短暂占据开封并改国号为大辽，但因统治失当引发中原激烈反抗，耶律德光被迫北撤，途中病逝；此举终结了五代中历时最短的后晋政权，暴露契丹对中原直接统治的局限性，为后来辽朝确立南北面官制埋下伏笔","q":"947年开封，历史画：契丹铁骑入汴京城门，耶律德光着皮裘皮帽坐于马上，后晋百官跪迎、宫室火起，冬日灰黄"},{"m":"中国篇","t":5,"n":"葵丘会盟","a":"河南省","p":"现图是现代仿古建筑。","d":"葵丘会盟发生于春秋中期，齐桓公召集鲁、宋、卫、郑等诸侯在葵丘举行盟誓，地点在今安徽省商丘市民权县境内，确立尊王攘夷、不得废嫡立庶等盟约条款，是春秋时期首次由诸侯主导的多国政治协调机制，强化了齐国霸主地位。","q":"公元前651年葵丘，历史画：齐桓公与诸侯登坛盟誓，周王使者授胙，诸侯甲士环列、旌旗如林，秋日平原与土坛"},{"m":"中国篇","t":5,"n":"衣冠南渡","a":"江苏省","p":"现图是城市高楼群。","d":"公元311年永嘉之乱后，晋怀帝被俘，洛阳沦陷，中原士族与百姓大规模南迁，琅琊王司马睿于建邺（今江苏省南京市秦淮区及建邺区交界处六朝建康城遗址）建立政治中心，史称衣冠南渡；此次迁徙持续至东晋初年，带来北方先进农业技术、典籍制度与士族文化，促使江南地区经济文化加速开发，奠定此后三百余年南北分治的政治地理基础。","q":"317年建康江畔，历史画：中原士族携家眷、书箱与礼器登舟南渡，江面舟楫相连，回头望北岸烽烟，冷灰与淡青"},{"m":"中国篇","t":5,"n":"赵州桥建成","a":"河北省","p":"现图是古地图。","d":"赵州桥由隋代工匠李春主持设计建造，于隋炀帝大业年间（605年左右）竣工，位于赵郡洨河之上，即今河北省石家庄市赵县赵州镇洨河两岸，全长50.82米，单孔敞肩圆弧石拱跨度达37.02米，首创敞肩拱结构，减轻自重并增强泄洪能力，历经十次以上强烈地震与千年洪水仍屹立不倒，是世界现存最早、保存最完整的敞肩石拱桥，标志着古代桥梁工程的划时代成就。","q":"605年赵州，历史画：李春立于洨河岸边指挥工匠合龙石拱，敞肩石拱桥横跨河面，工匠抬石、绳索与脚手架，青灰石色"},{"m":"中国篇","t":5,"n":"越王勾践剑出土","a":"湖北省","p":"现图是现代斜拉桥。","d":"越王勾践剑于1965年12月在湖北省荆州市荆州区望山一号楚墓中出土，该墓属战国中期楚国贵族下葬，剑长55.7厘米，饰菱形暗纹与错金鸟篆铭文“越王勾践自作用剑”，历经2400余年仍寒光凛冽、锋刃如新，其复合金属工艺与防腐技术代表春秋晚期青铜冶炼巅峰水平，为研究吴越历史、楚越关系及先秦科技提供不可替代的一手实物证据。","q":"1965年江陵望山，档案照片风格：考古人员在椁室积水中取出青铜剑，剑身菱形暗格纹与鸟篆铭文，探方与编号牌，白炽灯"},{"m":"中国篇","t":5,"n":"阿睦尔撒纳伊犁叛乱","a":"新疆维吾尔自治区","p":"现图是夜市与清真寺。","d":"约1755年，归附清朝的准噶尔部首领阿睦尔撒纳在今新疆维吾尔自治区伊犁哈萨克自治州伊宁市一带起兵反清，清军次年再度西征将其击溃，阿睦尔撒纳逃亡俄国后病死，乾隆帝遂于1762年设伊犁将军统辖天山南北，驻节惠远城，确立清朝对新疆的军府管理制度，实现中央对西域的直接军事与行政管辖。","q":"1755年伊犁，历史画：准噶尔骑兵在伊犁河谷集结，阿睦尔撒纳着皮甲立于旗下，清军绿营列阵、火炮轰击，雪山与尘烟"},{"m":"中国篇","t":5,"n":"鲜卑慕容皝建前燕","a":"辽宁省","p":"现图是带说明文字的展陈。","d":"东晋咸康三年（337年），鲜卑慕容部首领慕容皝自称燕王，建燕国，定都大棘城，史称前燕。其政权以辽西为中心，推行汉制、兴办教育、整饬军政，成为十六国前期重要割据势力。前燕后迁都龙城，持续至370年为前秦所灭。事件发生地为大棘城，今辽宁省朝阳市。","q":"337年龙城，历史画：慕容皝着鲜卑式甲胄在土城高台称燕王，诸部首领献马，棘城与辽西丘陵、秋草，赭黄设色"},{"m":"世界篇","t":1,"n":"中途岛海战","a":"","p":"现图是舰船模型/博物馆背景，不是海战。","d":"1942年6月，美国海军与日本海军在中途岛海域爆发海战，地点在今美国夏威夷州中途岛环礁。美军破译日军密码，提前设伏，击沉四艘日军主力航母，扭转太平洋战场态势。日军丧失战略主动权，美军转入反攻。此役是太平洋战争关键转折点。","q":"1942年6月中途岛，黑白档案照片：美军俯冲轰炸机扑向日军航母，甲板起火浓烟、舰体倾斜，海面油污与高炮弹幕，胶片颗粒"},{"m":"世界篇","t":1,"n":"俄国十月革命","a":"Russia","p":"现图是沙皇群像素描，与十月革命无关。","d":"俄国十月革命发生于1917年11月7日（俄历10月25日），地点为原俄罗斯帝国首都彼得格勒，即今俄罗斯联邦圣彼得堡市，由布尔什维克党领袖列宁领导赤卫队与革命士兵发动武装起义，攻占冬宫推翻资产阶级临时政府，建立世界上第一个苏维埃政权，直接导致俄罗斯帝国终结、苏联成立，并深刻改变20世纪全球政治格局与意识形态版图。","q":"1917年11月彼得格勒，历史画：赤卫队与士兵冲入冬宫楼梯，水兵持枪、红旗招展，吊灯与大理石廊柱，暗红与冷蓝"},{"m":"世界篇","t":1,"n":"君士坦丁堡陷落","a":"Turkey","p":"现图为现代人像雕塑，非事件画面。","d":"1453年5月29日，奥斯曼帝国军队在穆罕默德二世指挥下围攻拜占庭帝国首都，今土耳其伊斯坦布尔老城，经五十三天围城后突破陆墙，末代皇帝君士坦丁十一世战死，城市更名伊斯坦布尔，东正教中心转移至莫斯科，奥斯曼获得黑海与地中海交汇枢纽。","q":"1453年5月君士坦丁堡，历史画：奥斯曼军队拖拽巨炮轰击君士坦丁城墙，士兵翻越缺口，圣索菲亚穹顶在远处，烟尘与新月旗"},{"m":"世界篇","t":1,"n":"宗教改革开始","a":"Germany","p":"现图是现代教堂外墙涂鸦。","d":"1517年10月31日，马丁·路德在德意志维滕贝格诸圣堂大门张贴《九十五条论纲》，质疑赎罪券神学依据；论纲经印刷传播引发广泛神学辩论，促使德意志诸侯分裂为支持与反对改革两派，奠定新教各宗派独立发展的制度基础。","q":"1517年维滕贝格，历史画：马丁·路德在城堡教堂大门钉上《九十五条论纲》，修士与市民围观，羊皮纸与鹅毛笔，秋日石墙"},{"m":"世界篇","t":1,"n":"攻占巴士底狱","a":"France","p":"现图是现代阅兵场景。","d":"1789年7月14日，巴黎民众攻占位于今法国巴黎第四区的巴士底狱。交战双方为武装市民与守卫监狱的皇家卫队。该堡垒原为中世纪要塞，当时仅关押七名囚犯，但象征波旁王朝专制权威。民众夺取武器弹药后，监狱长被杀。事件成为法国大革命爆发的标志性起点，促使三级会议转向国民议会，加速旧制度瓦解。","q":"1789年7月14日巴黎，历史画：民众与卫兵攻占巴士底狱，吊桥被放下、炮口对准要塞，浓烟与石墙、人群攀爬，灰褐冷调"},{"m":"世界篇","t":1,"n":"日本无条件投降","a":"Japan","p":"现图是海战燃烧画，与投降无关。","d":"1945年8月15日正午，日本昭和天皇裕仁通过广播发布《终战诏书》，宣布接受《波茨坦公告》无条件投降；9月2日，盟军最高统帅麦克阿瑟在东京湾美军密苏里号战列舰上主持受降仪式；日本放弃所有海外殖民地与军事占领区，主权受限，进入盟军占领时期；此投降终结第二次世界大战，确立战后亚太秩序框架；天皇广播自皇宫发出，受降仪式在东京湾，今日本东京都。","q":"1945年9月2日东京湾，黑白档案照片：密苏里号战列舰甲板上日方代表签署投降书，盟军将领列队，舰炮与舱面，闪光灯与胶片颗粒"},{"m":"世界篇","t":1,"n":"柏林战役","a":"Germany","p":"现图是勃兰登堡门人群画，非1945年巷战。","d":"1945年4月16日至5月2日，苏联红军集结两百五十万兵力与六千余辆坦克，从东、南、北三面合围柏林市区，与纳粹德国守军展开惨烈巷战，逐街逐楼争夺勃兰登堡门、总理府及国会大厦等核心目标；德军抵抗彻底瓦解后希特勒自杀，柏林守军于5月2日投降，欧洲战场战事随之终结。","q":"1945年4月柏林，历史画：苏军步兵在废墟街巷推进，坦克碾过瓦砾，国会大厦圆顶在硝烟后，红旗与探照灯光柱"},{"m":"世界篇","t":1,"n":"苏联解体","a":"Russia","p":"现图是宗教题材画，非事件画面。","d":"1991年12月25日，苏联总统戈尔巴乔夫在莫斯科克里姆林宫宣布辞职，次日苏联最高苏维埃共和国院通过决议宣告苏联停止存在；此前八一九事件失败已使中央权威瓦解，11个加盟共和国签署《阿拉木图宣言》成立独联体；苏联解体终结冷战两极格局，催生15个主权国家，深刻重塑全球地缘政治与安全秩序；权力交接与最终宣告均发生在莫斯科克里姆林宫，今俄罗斯联邦莫斯科市。","q":"1991年12月莫斯科，档案照片风格：克里姆林宫上空降下苏联红旗，广场人群与摄像机，冬日阴云与路灯，彩色胶片颗粒"},{"m":"世界篇","t":1,"n":"英国光荣革命","a":"United Kingdom","p":"现图为20世纪街头老照片，与1688年无关。","d":"1688年11月，荷兰执政奥兰治的威廉率1.5万精锐登陆英格兰托尔湾，未遇抵抗即向伦敦推进；英王詹姆斯二世众叛亲离，于12月逃往法国；1689年2月议会通过《权利法案》，确立君主立宪制，限制王权并保障议会权力；此政变式更迭终结斯图亚特王朝专制倾向，为英国现代宪政奠基；全过程核心政治运作集中于伦敦威斯敏斯特宫及白厅，今英国英格兰大伦敦市。","q":"1688年11月伦敦，历史画：威廉三世率荷兰舰队在托贝登陆，贵族与市民迎接，战马与仪仗，海雾与秋林，褐绿设色"},{"m":"世界篇","t":1,"n":"阿波罗11号登月","a":"United States","p":"现图是宇航员合影加烟花，非登月画面。","d":"1969年7月20日，美国国家航空航天局发射的阿波罗11号飞船在月球静海着陆，宇航员阿姆斯特朗与奥尔德林完成人类首次月面行走并采集岩石样本，柯林斯留守指令舱绕月飞行，休斯敦约翰逊航天中心全程指挥控制；任务成功标志美国赢得太空竞赛关键一役，极大提升其科技威望与国际影响力。","q":"1969年7月月球静海，档案照片风格：阿姆斯特朗在月面插星条旗，登月舱与脚印、地球悬于黑色天幕，高对比黑白"},{"m":"世界篇","t":2,"n":"列宁格勒保卫战","a":"Russia","p":"现图是现代馆舍建筑。","d":"1941年9月至1944年1月，纳粹德国北方集团军群围困苏联第二大城市列宁格勒（今圣彼得堡），切断全部陆路通道；守军与市民在极端饥寒中坚持900天，死亡人数逾120万，主要因饥饿与炮击；苏军最终打破封锁，收复外围要地；此役是人类战争史上持续时间最长、破坏最惨烈的围城战之一，彰显苏联军民顽强意志；战场核心区域即今俄罗斯圣彼得堡市全境及列宁格勒州。","q":"1941年冬列宁格勒，黑白档案照片：士兵在雪地战壕中持枪警戒，冰封街道与防空沙袋，远处建筑剪影，颗粒粗"},{"m":"世界篇","t":2,"n":"华沙起义","a":"Poland","p":"现图为拼贴式旧照。","d":"1944年8月1日，波兰家乡军在德国占领下的华沙发动大规模武装起义，意图在苏联红军抵达前解放首都，起义持续63天，因缺乏外部支援与重武器而失败，城市遭系统性摧毁，大量平民死亡，战后华沙按历史图纸重建老城","q":"1944年8月华沙，黑白档案照片：起义者持步枪在街垒后射击，建筑起火、砖墙弹孔，少女递弹匣，烟尘与逆光"},{"m":"世界篇","t":2,"n":"古巴革命胜利","a":"Cuba","p":"现图是三张照片拼贴。","d":"1959年1月1日，菲德尔·卡斯特罗率领七二六运动武装力量攻占古巴首都哈瓦那，推翻美国扶植的巴蒂斯塔独裁政权，次日成立革命政府；此举终结古巴百年依附性政治结构，催生西半球首个社会主义国家，引发长达六十年的美古对抗与拉丁美洲左翼浪潮，哈瓦那今为古巴共和国首都，位于古巴岛西北端哈瓦那省哈瓦那市。","q":"1959年1月哈瓦那，黑白档案照片：卡斯特罗率纵队进入哈瓦那，民众夹道欢呼挥手，军车与棕榈，阳光与胶片颗粒"},{"m":"世界篇","t":2,"n":"布拉格之春","a":"Czech Rep.","p":"现图是一本书的封面照片。","d":"1968年8月，苏联、波兰、匈牙利、保加利亚和东德五国军队联合出兵捷克斯洛伐克，攻占首都布拉格（今捷克共和国布拉格），镇压杜布切克领导的改革运动；行动未遇武装抵抗，捷共中央被拘押，改革政策被废止；捷克斯洛伐克此后进入“正常化”时期，政治自由全面倒退。","q":"1968年8月布拉格，档案照片风格：苏军坦克停在瓦茨拉夫广场，青年手持国旗与标语对峙，石板路与建筑立面，彩色褪色感"},{"m":"世界篇","t":2,"n":"开罗宣言签署","a":"Egypt","p":"现图是一座教堂建筑。","d":"1943年11月，中美英三国首脑在埃及开罗举行会议，联合发表《开罗宣言》，明确要求日本归还窃取的中国东北、台湾、澎湖列岛等领土，剥夺其太平洋所占岛屿，确立战后东亚秩序基本框架，该文件成为1945年《波茨坦公告》及日本投降书的法律依据","q":"1943年11月开罗，黑白档案照片：罗斯福、丘吉尔、蒋介石并坐于会议长桌前，背景米字旗与青天白日旗，镁光灯"},{"m":"世界篇","t":2,"n":"拿破仑加冕","a":"France","p":"现图是翻拍画作的手机照（有手指入镜）。","d":"1804年12月2日，拿破仑在法国巴黎圣母院举行加冕典礼，由教皇庇护七世出席但未为其戴冠，拿破仑自行取冠加冕为法兰西皇帝，随后颁布《拿破仑法典》，确立资产阶级法律体系，将革命成果制度化并推广至欧洲多国","q":"1804年12月巴黎圣母院，历史油画风格：拿破仑自教皇手中取冠为约瑟芬加冕，教皇与枢机列坐，教堂廊柱与烛光，深红与金色"},{"m":"世界篇","t":2,"n":"水门事件","a":"United States","p":"现图是公园河景。","d":"1972年6月17日凌晨，五名潜入华盛顿特区水门大厦民主党全国委员会办公室安装窃听器的人员被捕，幕后牵涉尼克松总统连任委员会高官；后续调查揭露白宫掩盖行动及滥用行政权力，最终迫使尼克松于1974年8月辞职，成为美国宪政史上首位主动退位总统，事发建筑今属美国哥伦比亚特区华盛顿市西北区K街2500号。","q":"1972年6月华盛顿水门大厦，档案照片风格：深夜办公室内警察取证，手电与文件散落，窗外警灯，冷蓝与胶片颗粒"},{"m":"世界篇","t":2,"n":"第一次十字军攻陷耶路撒冷","a":"Palestine","p":"现图是圆顶清真寺建筑照。","d":"公元1099年7月15日，第一次十字军东征的法兰克、诺曼与洛林联军在戈弗雷·德·布永、雷蒙德四世等贵族统帅下攻破耶路撒冷城垣，经激烈巷战后屠戮大量穆斯林与犹太居民，建立耶路撒冷王国；此役标志十字军运动首次实现宗教军事目标，深刻改变近东政治格局，今耶路撒冷为以色列与巴勒斯坦争议首都，位于今以色列国耶路撒冷市及约旦河西岸地区。","q":"1099年7月耶路撒冷，历史画：十字军架云梯登上城墙，城内巷战与浓烟，圆顶建筑在远处，铁甲与红十字旗"},{"m":"世界篇","t":2,"n":"芝加哥大火","a":"United States","p":"现图是现代公园与天际线。","d":"1871年10月8日夜至10日，美国伊利诺伊州芝加哥市发生大规模火灾；起火点疑似城西德裔移民区一畜栏，强风助长火势迅速蔓延至木质建筑密集的市中心；大火持续燃烧三十小时，摧毁近三分之一城区，数万人无家可归；灾后重建推动美国现代消防制度与城市建筑法规建立；芝加哥消防博物馆旁的“大火起点”青铜铭牌嵌于草地边缘，黄昏金橙光线笼罩锈红砖墙与梧桐落叶，写实摄影风格","q":"1871年10月芝加哥，历史画：木构街区连片燃烧，居民推车抢运家什逃向湖边，浓烟遮日、火光映红湖面，灰黄与橙红"},{"m":"世界篇","t":2,"n":"西班牙内战爆发","a":"Spain","p":"现图是现代教堂建筑。","d":"1936年7月17日，西班牙驻摩洛哥殖民军将领弗朗西斯科·佛朗哥联合右翼势力发动军事政变，迅速控制西班牙南部与摩洛哥基地，次日马德里爆发大规模民众抵抗与共和政府军反击，内战全面爆发；战争持续至1939年4月1日，以佛朗哥建立独裁政权告终；马德里坚守近三年成为反法西斯象征；政变策源地与初期指挥中心位于今西班牙马德里自治区马德里市。","q":"1936年7月马德里，黑白档案照片：共和派民兵在街垒后持枪，标语与卡车，建筑弹孔，烟尘与逆光"},{"m":"世界篇","t":2,"n":"阿金库尔战役","a":"France","p":"现图是现代玻璃纪念碑。","d":"阿金库尔战役发生于1415年10月25日，英王亨利五世率约6000名以长弓手为主的军队，在法国北部加来海峡省阿金库尔村附近迎战法军主力约2.5万人；英军以少胜多，歼灭法军精锐骑士与贵族数千人，自身伤亡极微；此役重创法国军事贵族阶层，加速百年战争第二阶段英方优势确立，深刻影响中世纪晚期欧洲战术思想与民族意识发展；战场位于今法国上法兰西大区加来海峡省阿金库尔村一带。","q":"1415年10月阿金库尔，历史画：英军长弓手在泥泞田野齐射，法军重骑陷于烂泥，木桩与箭雨，灰绿与铁色"},{"m":"世界篇","t":3,"n":"五月花号抵达普利茅斯","a":"United States","p":"现图是墓园。","d":"1620年11月21日（儒略历），载有102名清教徒与契约佣工的五月花号帆船在经历六十六天跨大西洋航行后，于今美国马萨诸塞州科德角北岸普罗温斯敦港抛锚；乘客签署《五月花号公约》确立自治原则，随后南迁至普利茅斯湾建立北美第二个永久英属殖民地，奠定新英格兰自治传统与美国立宪精神雏形，登陆点普利茅斯今属美国马萨诸塞州普利茅斯县普利茅斯市。","q":"1620年11月普利茅斯，历史画：五月花号帆船锚泊于海湾，清教徒男女涉水登岸，木桶与火枪、荒林与雪地，冷灰蓝调"},{"m":"世界篇","t":3,"n":"关原之战","a":"Japan","p":"现图只是山谷远景。","d":"1600年10月21日，德川家康率东军约7.5万人与石田三成西军约8万人在美浓国关原平原决战，因小早川秀秋临阵倒戈致西军溃败；此战确立德川氏全国霸权，终结战国时代，为两年后江户幕府建立及持续二百六十余年的幕藩体制奠基；今日本岐阜县不破郡关原町。","q":"1600年10月关原，历史画：东西两军军阵在浓雾中对峙，铁炮齐射、旗指物林立，小早川军倒戈，秋草与泥泞"},{"m":"世界篇","t":3,"n":"卡迭石战役","a":"Syria","p":"现图是石刻门楼，非战役画面。","d":"约公元前1274年，古埃及法老拉美西斯二世与赫梯国王穆瓦塔里二世在奥伦特河畔交战，战场位于今叙利亚霍姆斯省东部；双方投入大量战车与步兵，激战数日未分胜负；战后缔结现存最早有文字记载的国际和平条约，以双语泥板形式保存；条约确立两国边界并约定军事互助。","q":"公元前1274年卡迭石，历史画：埃及战车队列冲击赫梯军阵，拉美西斯二世立于战车引弓，奥龙特斯河与城墙，赭黄设色"},{"m":"世界篇","t":3,"n":"哈丁战役","a":"Israel","p":"现图是现代城镇街景。","d":"1187年7月4日，阿尤布王朝苏丹萨拉丁率3万余穆斯林军队，在哈丁角（今以色列北部加利利地区提比里亚西南）围歼耶路撒冷王国主力。十字军因缺水陷入混乱，国王居伊及圣殿骑士团大团长被俘。耶路撒冷随后陷落，第三次十字军东征由此触发。今以色列北部加利利地区提比里亚西南。","q":"1187年7月哈丁角，历史画：十字军骑士在焦渴缺水的丘陵被萨拉丁骑兵合围，骑兵冲锋与箭雨，枯草与尘烟，褐红冷灰"},{"m":"世界篇","t":3,"n":"圣女贞德奥尔良解围","a":"France","p":"现图是河畔公园。","d":"1429年4至5月，法国少女贞德率王室军队突破英军对卢瓦尔河畔奥尔良城的长期围困，在连续攻占外围堡垒后迫使英军撤退，查理七世随后在兰斯加冕，贞德成为法兰西民族抵抗象征，其军事行动扭转百年战争中法国的战略被动局面。","q":"1429年5月奥尔良，历史画：贞德着白甲持旗冲上攻城梯，法军涌入图雷尔要塞，卢瓦尔河与火光，冷蓝与橙红"},{"m":"世界篇","t":3,"n":"大化改新","a":"Japan","p":"现图是一块巨石遗址。","d":"645年中大兄皇子与中臣镰足发动乙巳之变诛杀苏我入鹿后，孝德天皇于飞鸟京推行全面改革：仿唐制建中央集权官僚体系、颁行《近江令》雏形、实行班田收授法与租庸调制；此举终结氏姓贵族世袭体制，确立律令国家基础，深刻重塑日本政治经济结构；今日本奈良县高市郡明日香村。","q":"645年飞鸟，历史画：中大兄皇子与中臣镰足在板盖宫诛杀苏我入鹿，殿内血溅、群臣惊起，飞鸟寺与樱树，朱红与墨色"},{"m":"世界篇","t":3,"n":"托尔德西里亚斯条约签署","a":"Spain","p":"现图是古地图。","d":"1494年6月7日，西班牙与葡萄牙两国代表在卡斯蒂利亚王国托尔德西里亚斯镇签署《托尔德西里亚斯条约》，以佛得角群岛以西370里格处划定教皇子午线，线西新发现土地归西班牙、线东归葡萄牙；该条约首次以国际法形式瓜分全球殖民权，为大航海时代殖民秩序奠基，签约地托尔德西里亚斯今属西班牙卡斯蒂利亚-莱昂自治区巴利亚多利德省托尔德西里亚斯市。","q":"1494年托尔德西里亚斯，历史画：西班牙与葡萄牙使节在长桌前签署划界条约，桌上摊开地球仪与羊皮卷，烛光与纹章帷幔"},{"m":"世界篇","t":3,"n":"拿破仑远征埃及","a":"Egypt","p":"现图是现代街市。","d":"1798年拿破仑率领法国远征军在埃及亚历山大港登陆，地点位于今埃及亚历山大市西南海岸，法军迅速攻占港口，继而东进开罗，途中在金字塔战役击败马穆鲁克骑兵，此役展现法军战术革新与炮兵优势，同时开启欧洲对古埃及文明的系统性考古调查。","q":"1798年7月吉萨，历史画：法军方阵在金字塔前抵御马穆鲁克骑兵，拿破仑立马阵前，沙尘与金字塔剪影，赭黄冷灰"},{"m":"世界篇","t":3,"n":"查理曼加冕","a":"Italy","p":"现图是夜景城市与教堂。","d":"800年12月25日，法兰克国王查理曼赴罗马为教皇利奥三世平定叛乱后，在圣彼得大教堂由教皇加冕为“罗马人的皇帝”。此举打破西罗马帝国灭亡后324年无西帝局面，确立教权与王权相互依存关系，奠定神圣罗马帝国雏形，亦激化与拜占庭帝国的正统之争。今意大利拉齐奥大区罗马市。","q":"800年12月罗马，历史画：教皇利奥三世为查理曼戴上皇冠，圣彼得大教堂内烛光与金饰，跪伏的查理曼着罗马式长袍"},{"m":"世界篇","t":3,"n":"海地独立宣言发表","a":"Haiti","p":"现图是抽象纹理，无人物场景。","d":"1804年1月1日，让-雅克·德萨林在太子港正式宣告海地脱离法国独立，废除奴隶制，建立全球首个黑人共和国；此前十年间杜桑·卢维杜尔等领导黑人奴隶持续武装斗争，重创法军并迫使拿破仑放弃加勒比殖民计划；今海地共和国太子港市。","q":"1804年1月戈纳伊夫，历史画：德萨林与起义军将领在广场宣读独立宣言，撕毁法国旗、升起红蓝旗，棕榈与木构建筑，暖褐调"},{"m":"世界篇","t":3,"n":"米兰敕令颁布","a":"Italy","p":"现图是几何装饰图案。","d":"313年2月，罗马帝国君士坦丁一世与李锡尼在米兰会晤后联合颁布《米兰敕令》，宣布基督教与其他宗教同享合法地位，归还此前没收的教会财产，并承认信徒信仰自由。此举终结持续近三个世纪的系统性迫害，为基督教日后成为国教铺平道路，标志罗马宗教政策根本转向。今意大利伦巴第大区米兰市。","q":"313年米兰，历史画：君士坦丁与李锡尼在米兰会晤并颁布敕令，罗马官员与主教列席，羊皮卷与鹰旗，大理石厅堂"},{"m":"世界篇","t":3,"n":"罗马大火","a":"Italy","p":"现图是现代柱廊建筑。","d":"公元64年7月18日夜，罗马城帕拉丁山附近集市突发大火，连烧六天七夜，焚毁十四区中十区，包括大量平民住宅与古迹。史载尼禄皇帝未及时救火，反借机扩建金宫；后嫁祸基督徒施以酷刑，开启首次帝国级迫害。火灾加速城市重建与防火制度革新。今意大利拉齐奥大区罗马市。","q":"64年7月罗马，历史画：罗马城木构街区连片燃烧，居民逃向台伯河岸，尼禄在远处高台观火，浓烟与橙红火光"},{"m":"世界篇","t":3,"n":"门罗宣言发表","a":"United States","p":"现图是城市夜景。","d":"1823年12月2日，美国总统詹姆斯·门罗在国会年度咨文中宣布美洲不再容许欧洲列强建立新殖民地或干涉独立国家内政，同时承诺美国不介入欧洲事务；该宣言奠定美国西半球霸权基础，长期影响拉美外交格局；今美国华盛顿哥伦比亚特区。","q":"1823年12月华盛顿，历史画：门罗总统在国会大厅宣读咨文，议员列坐、烛台高照，窗外雪地与旗杆，冷褐调"},{"m":"世界篇","t":4,"n":"克雷西会战","a":"France","p":"现图是人物黑白肖像，与战役无关。","d":"1346年8月26日，英格兰国王爱德华三世率军在克雷西昂蓬蒂约迎战法国腓力六世统帅的法军。英军以长弓手为核心，利用地形设伏，重创法国重骑兵与弩兵。法军伤亡逾万人，腓力六世负伤溃退。此役确立长弓战术优势，开启百年战争英军主导阶段。事件发生地克雷西昂蓬蒂约今法国上法兰西大区索姆省克雷西昂蓬蒂约村。","q":"1346年8月克雷西，历史画：英军长弓手在坡地齐射，法军重骑与热那亚弩手阵形混乱，旗帜与箭雨，灰绿与铁色"},{"m":"世界篇","t":4,"n":"卡诺萨觐见","a":"Italy","p":"现图是冰川纹理。","d":"1077年1月，神圣罗马帝国皇帝亨利四世与教宗额我略七世因主教叙任权争端激烈对立，亨利四世冒雪前往今意大利雷焦艾米利亚省的卡诺萨城堡，在堡外赤足立雪三日请求宽恕；教宗最终解除其绝罚，但双方矛盾未解，此后冲突持续；此举凸显中世纪教权与皇权博弈的典型形态，成为政教关系史关键节点；卡诺萨城堡残存的灰褐色砂岩塔楼矗立于亚平宁山麓丘陵之上，冬日冷光勾勒断壁轮廓与枯枝剪影，写实摄影风格","q":"1077年1月卡诺萨，历史画：亨利四世赤足披毛毡立于雪中城堡门外，教皇格里高利七世在窗内，城墙与雪原，冷灰白"},{"m":"世界篇","t":4,"n":"孟买恐怖袭击","a":"India","p":"现图是海滨塔楼。","d":"2008年11月26日至29日，十名武装分子分头袭击印度马哈拉施特拉邦孟买市多个民用目标，包括泰姬陵酒店、奥贝罗伊酒店、贾特拉帕蒂·希瓦吉终点站等，事件导致多国公民伤亡，促使印度全面重组反恐情报与应急响应机制。","q":"2008年11月孟买，档案照片风格：泰姬玛哈酒店浓烟滚滚，消防水柱与警车，黑衣反恐队员持枪，夜间火光与烟雾"},{"m":"世界篇","t":4,"n":"帕维亚战役","a":"Italy","p":"现图是四图拼贴。","d":"1525年2月24日，神圣罗马帝国皇帝查理五世麾下西班牙-德意志联军在意大利北部帕维亚城郊重创法国国王弗朗索瓦一世亲率的法军，法王本人被俘。此役发生地帕维亚今属意大利伦巴第大区帕维亚省帕维亚市，标志着哈布斯堡王朝确立西欧霸权，终结法国对意大利半岛的主导企图，深刻改变16世纪欧洲军事格局与外交均势，火器与步兵方阵战术由此获得决定性验证。","q":"1525年2月帕维亚，历史画：法军重骑与西班牙火枪方阵在城墙外混战，法王弗朗索瓦一世被围，火绳枪硝烟与泥泞，铁灰与暗红"},{"m":"世界篇","t":4,"n":"帖木儿帝国建立","a":"Uzbekistan","p":"现图是瓷砖墙面。","d":"1370年，突厥化蒙古贵族帖木儿在河中地区撒马尔罕自立为埃米尔，逐步统一察合台汗国西部；1379年正式建都撒马尔罕，建立横跨中亚、波斯与两河流域的庞大帝国；今该城属乌兹别克斯坦撒马尔罕州首府；帝国虽短暂却以军事组织与城市营建著称，推动波斯—突厥文化复兴，其后裔巴布尔南下建立莫卧儿王朝，深刻影响南亚政治文化版图。","q":"1370年撒马尔罕，历史画：帖木儿在撒马尔罕王宫即位，诸将献刀与马，穹顶与琉璃砖墙、旌旗，青绿与金"},{"m":"世界篇","t":4,"n":"德黑兰会议","a":"Iran","p":"现图是邮票。","d":"1943年11月28日至12月1日，苏联、美国、英国三国首脑斯大林、罗斯福、丘吉尔在伊朗首都德黑兰举行首次战时峰会，确定开辟欧洲第二战场时间表，协调对德作战战略，并初步讨论战后世界秩序安排，会后盟军于1944年6月实施诺曼底登陆","q":"1943年11月德黑兰，黑白档案照片：罗斯福、丘吉尔、斯大林并坐于苏联大使馆会议厅，三国旗与皮椅，镁光灯与胶片颗粒"},{"m":"世界篇","t":4,"n":"桑地诺革命","a":"Nicaragua","p":"现图是糖果特写。","d":"1927年至1933年间，奥古斯托·塞萨尔·桑地诺领导尼加拉瓜农民武装在中美洲西北部莱昂省山区持续开展游击战争，反抗美国海军陆战队占领及亲美独裁政权。发生地今属尼加拉瓜莱昂省莱昂市周边山地，其“自由战士”理念催生拉美反帝思想谱系，虽于1934年遭暗杀，但直接促成1979年桑地诺民族解放阵线夺取政权，重塑中美洲地缘政治结构。","q":"1979年7月马那瓜，档案照片风格：桑地诺民族解放阵线战士乘卡车进入首都，民众挥旗欢呼，街垒与涂鸦墙，彩色褪色感"},{"m":"世界篇","t":4,"n":"沙隆战役","a":"France","p":"现图是运河小镇。","d":"451年6月20日，西罗马统帅埃提乌斯联合西哥特国王狄奥多里克一世，在沙隆平原与匈奴王阿提拉率领的联军展开决战，双方死伤逾十万；西罗马联军惨胜迫使匈奴退出高卢，阿提拉次年转攻意大利后病逝，匈奴帝国迅速瓦解，西欧政治格局由此根本改写；今法国马恩省沙隆昂香槟市。","q":"451年沙隆，历史画：罗马与西哥特联军骑兵在卡塔隆平原迎击匈人，阿提拉车阵与箭雨，焚村与尘烟，褐黄冷灰"},{"m":"世界篇","t":4,"n":"瓦尔纳战役","a":"Bulgaria","p":"现图是石砌教堂。","d":"1444年11月10日，奥斯曼帝国苏丹穆拉德二世率军在黑海西岸瓦尔纳城附近击溃由波兰国王兼匈牙利国王瓦迪斯瓦夫三世、匈牙利名将匈雅提·亚诺什统帅的十字军联军，瓦迪斯瓦夫战死沙场。发生地今属保加利亚瓦尔纳州瓦尔纳市，此役终结了欧洲最后一次大规模反奥斯曼东征，使巴尔干基督教国家丧失战略主动权，奥斯曼对多瑙河以南统治自此不可撼动。","q":"1444年11月瓦尔纳，历史画：十字军与奥斯曼军在黑海沿岸沼泽交战，波兰国王瓦迪斯瓦夫三世阵亡，旗帜倒伏，冷雨与泥泞"},{"m":"世界篇","t":4,"n":"科索沃战役","a":"Kosovo","p":"现图是现代城市街道。","d":"1389年6月15日（儒略历），奥斯曼帝国苏丹穆拉德一世统帅的军队与塞尔维亚大公拉扎尔·赫雷别利亚诺维奇率领的巴尔干联军在科索沃平原展开决战，双方损失惨重，拉扎尔战死、穆拉德遇刺身亡，奥斯曼最终控制战场。发生地今属科索沃普里什蒂纳市郊，此役成为塞尔维亚民族记忆核心象征，亦标志奥斯曼势力稳固深入巴尔干腹地，为后续征服君士坦丁堡奠定战略基础。","q":"1389年6月科索沃，历史画：塞尔维亚重骑与奥斯曼军阵在平原相遇，拉扎尔大公与穆拉德一世，旗幡与箭雨，灰绿褐"},{"m":"世界篇","t":4,"n":"第四次十字军攻陷君士坦丁堡","a":"Turkey","p":"现图是伊斯坦布尔集市街。","d":"1204年4月13日，第四次十字军东征部队在威尼斯总督恩里科·丹多洛策动下转攻拜占庭帝国首都君士坦丁堡，经激烈巷战破城；拉丁帝国随即建立，希腊正教会被迫让位于天主教宗座；今该城即土耳其伊斯坦布尔市欧洲部分；此举彻底撕裂东西方教会，削弱拜占庭抵抗奥斯曼力量，使十字军运动丧失道义正当性，加速地中海权力向意大利城邦转移。","q":"1204年4月君士坦丁堡，历史画：十字军自海上城墙缺口涌入，威尼斯战船撞开铁链，城内火光与圣索菲亚穹顶，橙红与铜绿"},{"m":"世界篇","t":4,"n":"萨珊波斯围攻安条克","a":"Turkey","p":"现图是石雕浮雕特写。","d":"公元540年，萨珊波斯军队在霍斯劳一世率领下攻陷拜占庭帝国重要城市安条克，该地位于今土耳其哈塔伊省安塔基亚。波斯军破城后劫掠并迁走部分居民，随后拜占庭皇帝查士丁尼一世重建该城并加强防御，安条克自此丧失地中海东岸核心地位。","q":"540年安条克，历史画：萨珊波斯军队架云梯攻城，城头守军投石射箭，城墙与硝烟、战象，赭黄冷灰"},{"m":"世界篇","t":4,"n":"阿斯旺大坝落成","a":"Egypt","p":"现图是清真寺。","d":"1970年7月21日，埃及总统纳赛尔主持竣工仪式，阿斯旺高坝在尼罗河上游正式落成；工程历时十年，由苏联提供技术援助，今位于埃及阿斯旺省阿斯旺市以南；大坝形成纳赛尔湖，彻底改变尼罗河水文节律，实现全年灌溉与电力供应，但也导致阿布辛贝神庙等古迹淹没，经联合国教科文组织跨国搬迁才得以保存。","q":"1971年阿斯旺，档案照片风格：大坝坝体与纳赛尔湖水面，埃及工程师与官员在坝顶剪彩，烈日与蓝色水面，彩色胶片"},{"m":"世界篇","t":4,"n":"马哈茂德二世废除近卫军","a":"Turkey","p":"现图是伊斯坦布尔航拍。","d":"1826年6月，奥斯曼帝国苏丹马哈茂德二世在伊斯坦布尔托普卡帕宫下令解散耶尼切里军团，遭反抗后动用新式炮兵镇压，焚毁耶尼切里兵营，此后推行军事改革建立现代陆军，终结延续六百余年的禁卫军制度，开启坦志麦特改革进程。","q":"1826年6月伊斯坦布尔，历史画：苏丹马哈茂德二世在广场检阅新军，近卫军营房被炮火轰击、旗帜倒下，烟尘与红色礼服"},{"m":"世界篇","t":5,"n":"伊散德尔瓦纳战役","a":"South Africa","p":"现图只有天空与远景。","d":"1879年1月22日，英国殖民军队约1700人在南非祖鲁王国北部的伊散德尔瓦纳山麓遭祖鲁国王塞奇瓦约麾下约2万名战士突袭围歼，英军几乎全军覆没；此役发生地今属南非共和国夸祖鲁-纳塔尔省北部山区，是19世纪非洲原住民抵抗欧洲殖民扩张最重大的军事胜利之一，直接导致英国调整对祖鲁政策并发动第二次祖鲁战争，深刻影响南部非洲殖民格局演变。","q":"1879年1月伊散德尔瓦纳，历史画：祖鲁武士以牛角阵冲击英军营地，英军红衫队列射击后溃退，帐篷与牛车，金褐草原尘土"},{"m":"世界篇","t":5,"n":"克鲁亚围城战","a":"Albania","p":"现图是街边汽车与招牌。","d":"1450年，奥斯曼苏丹穆拉德二世亲率十万大军围攻阿尔巴尼亚中部要塞克鲁亚，今阿尔巴尼亚地拉那州克鲁亚市，由斯坎德培率领阿尔巴尼亚联军依托山地工事顽强抵抗半年之久，最终击退奥斯曼主力，此役打破奥斯曼不可战胜神话，激发巴尔干各族持久抵抗，斯坎德培据此建立长达二十五年的阿尔巴尼亚抵抗政权，延缓奥斯曼西进进程达数十年。","q":"1450年克鲁亚，历史画：斯坎德培率阿尔巴尼亚山地兵自城堡出击，奥斯曼军围攻营地大乱，山岩与石堡、新月旗"},{"m":"世界篇","t":5,"n":"十二月党人起义","a":"Russia","p":"现图是建筑铆钉特写。","d":"1825年12月26日（俄历）十二月党人起义在俄罗斯帝国首都圣彼得堡参政院广场爆发，由近三千名近卫军军官与士兵发起，要求废除农奴制、实行君主立宪，拥立康斯坦丁大公；沙皇尼古拉一世调集重兵镇压，起义失败后百余人受审，五名领袖被绞死，百余人流放西伯利亚；今俄罗斯圣彼得堡市。","q":"1825年12月彼得堡，历史画：十二月党人军官率士兵在元老院广场方阵集结，市民围观，近卫骑兵冲击，冬雪与灰蓝天"},{"m":"世界篇","t":5,"n":"威廉·华莱士遇害","a":"United Kingdom","p":"现图是雪中木屋。","d":"1305年8月23日，苏格兰民族英雄威廉·华莱士在伦敦威斯敏斯特厅经英格兰法庭草率审判后，被以叛国罪处以绞刑、剖腹、分尸等酷刑，遗体残肢分悬于纽卡斯尔、伯里克、斯特灵及阿伯丁四地；行刑地伦敦今属英国大伦敦地区，此事件激化苏格兰独立运动，促成罗伯特·布鲁斯后续加冕与班诺克本战役胜利，奠定苏格兰王国存续基础。","q":"1305年8月伦敦，历史画：华莱士被押上史密斯菲尔德刑场，围观人群与卫兵长戟，绞架与灰石建筑，阴云冷灰"},{"m":"世界篇","t":5,"n":"岛原之乱","a":"Japan","p":"现图是空旷草原。","d":"1637年末至1638年初，日本九州岛原半岛爆发天主教徒与农民联合反幕府起义，今日本长崎县南岛原市一带，由天草四郎时贞领导，约三万七千人据守原城坚持数月，德川幕府调集十余万兵力围攻，1638年4月原城陷落，起义者全体战死或被屠杀，幕府借此强化锁国政策与禁教法令，终结日本天主教公开传播史，确立江户时代严密身份控制体制。","q":"1638年岛原，历史画：原城天守被幕府军炮击起火，起义农民持枪守城，诸藩旗指物与战船，海雾与硝烟"},{"m":"世界篇","t":5,"n":"巴布教起义","a":"Iran","p":"现图是山野天空。","d":"1848年，伊朗设拉子爆发巴布教徒武装起义，今伊朗法尔斯省设拉子市，由赛义德·阿里·穆罕默德（巴布）创立的新宗教运动引发社会动荡，起义者一度控制设拉子部分地区，遭卡扎尔王朝军队血腥镇压，巴布于1850年在大不里士被处决，但教义演变为巴哈伊信仰，对伊朗近代宗教思想变革与宪政运动产生深远影响，亦暴露卡扎尔政权治理危机。","q":"1848年设拉子，历史画：巴布教徒持刀枪在清真寺与街巷据守，政府军围攻，土墙与拱廊、硝烟，赭黄冷灰"},{"m":"世界篇","t":5,"n":"帕齐阴谋","a":"Italy","p":"现图是别墅花园。","d":"1478年4月26日帕齐阴谋在意大利佛罗伦萨圣母百花大教堂内发动，由帕齐家族联合教皇西克斯图斯四世及那不勒斯国王费兰特策划，意图刺杀洛伦佐·德·美第奇及其兄朱利亚诺；朱利亚诺当场身亡，洛伦佐负伤幸存，事后美第奇家族清洗政敌，巩固佛罗伦萨统治权达数十年；今意大利托斯卡纳大区佛罗伦萨市。","q":"1478年4月佛罗伦萨，历史画：圣母百花大教堂内弥撒之际，刺客持匕首扑向朱利亚诺·德·美第奇，洛伦佐持剑自卫，穹顶与烛光"},{"m":"世界篇","t":5,"n":"戊辰战争爆发","a":"Japan","p":"现图是公交车站。","d":"1868年1月27日戊辰战争在会津若松城爆发，以萨摩、长州藩为主力的明治新政府军与旧幕府支持者会津藩在若松城展开激战，历时半年，最终会津藩投降，藩主松平容保被幽禁，大量武士切腹或流放；此战标志日本幕藩体制彻底终结，天皇中央集权确立；今日本福岛县会津若松市。","q":"1868年1月会津，历史画：新政府军以火炮轰击若松城，白虎队少年持枪列阵，城郭与雪原、锦旗，冷灰与朱红"},{"m":"世界篇","t":5,"n":"第一次瓜分波兰","a":"Poland","p":"现图是古地图。","d":"1772年第一次瓜分波兰由俄罗斯帝国、普鲁士王国与奥地利哈布斯堡君主国共同实施，三国军队未经大规模交战即占领波兰立陶宛联邦约30%领土与三分之一人口，华沙政府被迫于9月30日在俄军刺刀下签署承认条约；此为波兰亡国三部曲之始，标志东欧地缘格局剧变；今波兰首都华沙市。","q":"1772年华沙，历史画：俄普奥三国使节在华沙王宫逼迫波兰议会批准割地条约，议员跪伏抗议，王座与地图卷轴"},{"m":"世界篇","t":5,"n":"路易十四迁宫凡尔赛","a":"France","p":"现图是燃烧城市画。","d":"1682年5月6日，法国国王路易十四正式将宫廷与中央政府从巴黎卢浮宫迁至凡尔赛宫，此后三十年持续扩建，使之成为拥有2300余房间的欧洲最大宫殿；迁宫地点凡尔赛今属法国法兰西岛大区伊夫林省凡尔赛市，此举既削弱贵族地方势力又强化王权象征，使凡尔赛成为绝对君主制运作核心，其行政模式与文化范式辐射全欧，奠定近代国家官僚体系雏形。","q":"1682年凡尔赛，历史画：路易十四率宫廷队伍自巴黎迁入凡尔赛宫，镜厅与花园喷泉，贵族车驾绵延，金蓝与石白"},{"m":"世界篇","t":5,"n":"里斯本大地震","a":"Portugal","p":"现图是展厅屏幕与沙盘。","d":"1755年11月1日里斯本大地震重创葡萄牙首都，震级估计达8.5—9.0级，引发海啸与持续六日大火，导致约6万至10万人死亡，城市85%建筑被毁，包括王宫、图书馆与教堂；灾后庞巴尔侯爵推行现代抗震城市规划，推动启蒙思想在伊比利亚半岛传播；今葡萄牙里斯本市。","q":"1755年11月里斯本，历史画：地震后城市大火与海啸，教堂穹顶坍塌，居民在河边广场避难，浓烟与灰蓝天"},{"m":"世界篇","t":5,"n":"阿姆斯特丹银行成立","a":"Netherlands","p":"现图是夜间运河城市照。","d":"1609年荷兰共和国在阿姆斯特丹设立公共银行，由阿姆斯特丹市议会主导建立，地点位于今荷兰阿姆斯特丹市中心。该银行接受金银铸币与银行券存兑，确立了部分准备金制度与转账结算规则，不向政府提供无担保贷款，成为近代中央银行雏形，显著提升了荷兰商业信用体系稳定性与国际金融地位。","q":"1609年阿姆斯特丹，历史画：市民与商人在市政厅内兑换金银、登记账簿，柜台与钱袋、秤具，烛光与橡木，褐金调"},{"m":"世界篇","t":5,"n":"阿拔斯王朝建立","a":"Iraq","p":"现图是建筑工地。","d":"750年阿拔斯王朝在伊拉克库法城正式建立，阿布·阿拔斯·萨法赫率呼罗珊军队击败倭马亚王朝末代哈里发马尔万一世于扎卜河战役后，在库法清真寺登基，确立以“黑旗”为象征的新哈里发政权；该王朝定都巴格达，开创伊斯兰黄金时代，推动科学、哲学与翻译运动达五个世纪；今伊拉克纳杰夫省库法遗址（属今纳杰夫市辖区）。","q":"750年库法，历史画：呼罗珊黑旗军在库法清真寺前拥立阿布·阿拔斯，倭马亚旗帜被扯下，黑袍与黑旗，土黄冷灰"},{"m":"世界篇","t":5,"n":"青年土耳其党革命","a":"Greece","p":"现图是挂花环的建筑外墙。","d":"1908年7月，青年土耳其党军官在奥斯曼帝国马其顿省首府萨洛尼卡发动军事行动，迫使苏丹阿卜杜勒-哈米德二世恢复1876年宪法并召开议会。起义迅速蔓延至伊斯坦布尔等地，终结专制统治，开启奥斯曼立宪时期。该运动促成1909年苏丹被废黜及后续改革。事件发生地萨洛尼卡今希腊中马其顿大区塞萨洛尼基市。","q":"1908年7月萨洛尼卡，档案照片风格：青年土耳其党军官与民众在广场集会，宣读恢复宪法公告，奥斯曼旗与礼帽，黑白颗粒"},{"m":"世界篇","t":5,"n":"魏玛共和国成立","a":"Germany","p":"现图是现代白色建筑。","d":"1919年魏玛共和国在德国图林根州魏玛市正式宣告成立，由社会民主党主导的国民议会通过《魏玛宪法》，艾伯特出任首任总统；这一资产阶级民主政体取代了德意志帝国，但因凡尔赛条约苛刻条款、经济危机与极右翼势力崛起而根基不稳，最终于1933年被纳粹党终结；今德国图林根州魏玛市。","q":"1919年2月魏玛，档案照片风格：国民议会在魏玛国家剧院开幕，代表入座、军警列队，剧院立面与旗帜，黑白颗粒"},{"m":"世界篇","t":5,"n":"麦哲伦在麦克坦岛战死","a":"Philippines","p":"现图是手表店内部。","d":"1521年4月27日，葡萄牙航海家斐迪南·麦哲伦率领西班牙远征舰队在菲律宾群岛中部麦克坦岛海岸登陆时，遭当地酋长拉普拉普率部众激烈抵抗，麦哲伦本人身中数矛溺亡于浅滩；战场位置今属菲律宾共和国宿务省麦克坦市沿海地带，此役终结麦哲伦环球航行，却促使西班牙十年后正式殖民菲律宾，开启亚洲—美洲跨太平洋贸易与天主教东传新阶段。","q":"1521年4月麦克坦岛，历史画：麦哲伦率西班牙士兵涉水登岸，拉普拉普战士持矛弓箭围攻，海浪与椰林、铁甲，青绿与土红"}];
const tb=document.getElementById("tb");
function render(f){
  const q=(f||"").trim().toLowerCase();
  tb.innerHTML=D.filter(d=>!q||d.n.toLowerCase().includes(q)||(d.a||"").toLowerCase().includes(q)||d.q.toLowerCase().includes(q)||d.d.toLowerCase().includes(q))
   .map(d=>`<tr><td>${d.m}</td><td>${d.t}★</td><td class="n">${d.n}</td><td>${d.a||"—"}</td>
   <td class="p">${d.p}</td><td class="d">${d.d}</td><td class="q">${d.q}</td></tr>`).join("");
}
document.getElementById("q").addEventListener("input",e=>render(e.target.value));
render("");
</script></body></html>
