<script>
const D=[{"m":"中国篇","t":1,"n":"郑和下西洋","a":"江苏省","p":"现图是带大段文字的展板。","d":"1405年7月11日，明成祖朱棣派遣郑和率领由二百四十多艘海船、二万七千余名官兵组成的庞大船队，自南京龙江关启航远航西洋，首航经占城、爪哇至古里返航；此后二十八年间七下西洋，最远抵达东非海岸与红海入口。始发地今属江苏省南京市鼓楼区下关街道龙江宝船厂遗址片区，此举开创人类航海史上空前规模远洋活动，促进中外政治交往、经贸往来与技术传播，彰显明代前期中国海洋实力与和平外交理念。","q":"1405年太仓刘家港，历史画：九桅宝船列阵出港，郑和着宦官蟒袍立于船首，水手攀索扬帆，岸上仪仗与旗帜，海天开阔，工笔重彩"},{"m":"中国篇","t":2,"n":"荆轲刺秦王","a":"陕西省","p":"现图是刻满文字的石碑。","d":"公元前227年，燕国太子丹派荆轲携樊於期首级与督亢地图赴咸阳刺杀秦王嬴政。荆轲在咸阳宫献图时图穷匕见，追刺未中，被侍卫所杀。事件发生于秦都咸阳，即今陕西省咸阳市渭城区境内。刺杀失败加速秦国对燕国的征伐，次年秦军攻破燕都蓟城。此事成为秦统一过程中标志性反抗事件。","q":"公元前227年咸阳宫，历史画：荆轲展图穷而匕首现，左手把秦王衣袖，秦王绕柱拔剑，群臣惊乱无兵器，铜柱与竹简散落，深褐金线重彩"},{"m":"中国篇","t":3,"n":"七国之乱","a":"河南省","p":"现图是英文标注的政区图。","d":"公元前154年，吴王刘濞联合楚、赵等六国诸侯以“清君侧”为名起兵反汉，主力在梁国睢阳受阻，周亚夫率汉军断其粮道，三月后叛乱平定。主战场睢阳即今河南省商丘市睢阳区。七国之乱失败标志诸侯割据势力衰落，中央集权强化。","q":"公元前154年睢阳城下，历史画：吴楚联军蚁附攻城，梁军据城放箭，周亚夫轻骑自侧翼突袭粮道，旌旗与云梯，土黄冷灰设色"},{"m":"中国篇","t":3,"n":"秦始皇兵马俑出土","a":"陕西省","p":"现图是带水池的仿古建筑，不是兵马俑。","d":"1974年3月，陕西省临潼县西杨村农民打井时发现陶俑残片，经考古队发掘确认为秦始皇陵陪葬坑，出土兵马俑千余件及战车、兵器等，坑址位于今陕西省西安市临潼区秦始皇陵封土以东1.5公里处，属秦代京畿要地，此次发现改写世界对秦代军事制度、雕塑工艺与集权体制认知，成为20世纪中国最重要考古成果之一。","q":"1974年临潼，档案照片风格：考古人员在探方中清理陶俑，陶马与武士俑半露于黄土，毛刷与测量绳，颗粒粗、色调土黄"},{"m":"中国篇","t":4,"n":"朱元璋取集庆","a":"江苏省","p":"现图是街头小吃摊。","d":"公元1356年，朱元璋率红巾军渡江攻占集庆路，即今江苏省南京市主城区，改名应天府；此役使其获得江南核心据点和长江下游控制权，奠定统一南方基础；此后以应天为基地推行屯田、兴学、整军，逐步形成独立于其他红巾军系统的政权实体","q":"1356年集庆，历史画：红巾军攀梯登城，朱元璋着甲立于城外旗下指挥，城头元军溃散、火起，江畔战船，土黄冷灰"},{"m":"中国篇","t":4,"n":"朱熹出生","a":"福建省","p":"现图是时装人像照，完全不对。","d":"南宋高宗建炎四年（1130年），朱熹出生于南剑州尤溪县，即今福建省三明市尤溪县水南村；他师从李侗，融汇北宋理学诸家，构建以“理气论”“格物致知”为核心的庞大哲学体系；其《四书章句集注》成为元明清科举标准教科书，主导中国思想界七百余年；尤溪南溪书院为其幼年读书处，今存朱子故居遗址与相关纪念建筑群。","q":"1130年尤溪，工笔设色人物画：朱熹着宋式深衣、戴东坡巾端坐书案，手执四书章句稿本，案置砚台与竹简，闽中书院窗棂"},{"m":"中国篇","t":4,"n":"王安石出生","a":"江西省","p":"现图是现代馆舍建筑。","d":"北宋真宗天禧五年（1021年），王安石生于江南西路抚州临川县，即今江西省抚州市临川区邓家巷；他二十二岁中进士，历任地方官多年，后两度拜相推行变法；其主导的熙宁变法涉及青苗、均输、保甲等十余项制度革新，虽因阻力巨大而未能彻底成功，却深刻推动宋代财政军事改革思潮，其《临川先生文集》亦开宋诗新风，使临川成为北宋文化重镇之一。","q":"1021年临川，工笔设色人物画：王安石着宋式圆领袍端坐书斋，手执言事书草稿，案头烛台与茶盏，窗外修竹"},{"m":"中国篇","t":4,"n":"班超投笔从戎","a":"河南省","p":"现图是洛阳博物馆大门。","d":"东汉永平年间，班超在洛阳官府抄写文书时掷笔感叹大丈夫当立功异域，随即投笔从戎，加入窦固北征匈奴的部队。他凭借过人胆识与外交才能出使西域，以智勇安抚鄯善、于阗、疏勒等国，重建汉朝对西域的管辖体系，开启经营西域长达三十年的生涯，成为汉代边疆经略的典范人物。","q":"73年洛阳，历史画：班超在兰台案前掷笔而起，同僚惊视，窗外胡商驼队经过，竹简与笔砚散落，汉阙与黄沙色调"},{"m":"中国篇","t":5,"n":"左宗棠出生","a":"湖南省","p":"现图只有屋瓦天空。","d":"左宗棠于1812年出生于湖南长沙府湘阴县，即今湖南省岳阳市湘阴县樟树镇柳家冲，晚清军事家、政治家与洋务派代表人物，咸丰二年举人，率楚军平定太平军、捻军及陕甘回变，1875年受命督办新疆军务，收复除伊犁外全部失地，1884年促成新疆建省，强化西北边疆治理，其屯田、植柳、兴学举措至今留有深刻地理人文印记。","q":"1812年湘阴，工笔设色人物画：左宗棠着清式长衫坐于书斋，案上摊开舆图与《读史方舆纪要》，窗棂外洞庭烟波"},{"m":"中国篇","t":5,"n":"葵丘会盟","a":"河南省","p":"现图是现代仿古建筑。","d":"葵丘会盟发生于春秋中期，齐桓公召集鲁、宋、卫、郑等诸侯在葵丘举行盟誓，地点在今安徽省商丘市民权县境内，确立尊王攘夷、不得废嫡立庶等盟约条款，是春秋时期首次由诸侯主导的多国政治协调机制，强化了齐国霸主地位。","q":"公元前651年葵丘，历史画：齐桓公与诸侯登坛盟誓，周王使者授胙，诸侯甲士环列、旌旗如林，秋日平原与土坛"},{"m":"中国篇","t":5,"n":"越王勾践剑出土","a":"湖北省","p":"现图是现代斜拉桥。","d":"越王勾践剑于1965年12月在湖北省荆州市荆州区望山一号楚墓中出土，该墓属战国中期楚国贵族下葬，剑长55.7厘米，饰菱形暗纹与错金鸟篆铭文“越王勾践自作用剑”，历经2400余年仍寒光凛冽、锋刃如新，其复合金属工艺与防腐技术代表春秋晚期青铜冶炼巅峰水平，为研究吴越历史、楚越关系及先秦科技提供不可替代的一手实物证据。","q":"1965年江陵望山，档案照片风格：考古人员在椁室积水中取出青铜剑，剑身菱形暗格纹与鸟篆铭文，探方与编号牌，白炽灯"},{"m":"世界篇","t":1,"n":"苏联解体","a":"Russia","p":"现图是宗教题材画，非事件画面。","d":"1991年12月25日，苏联总统戈尔巴乔夫在莫斯科克里姆林宫宣布辞职，次日苏联最高苏维埃共和国院通过决议宣告苏联停止存在；此前八一九事件失败已使中央权威瓦解，11个加盟共和国签署《阿拉木图宣言》成立独联体；苏联解体终结冷战两极格局，催生15个主权国家，深刻重塑全球地缘政治与安全秩序；权力交接与最终宣告均发生在莫斯科克里姆林宫，今俄罗斯联邦莫斯科市。","q":"1991年12月莫斯科，档案照片风格：克里姆林宫上空降下苏联红旗，广场人群与摄像机，冬日阴云与路灯，彩色胶片颗粒"},{"m":"世界篇","t":3,"n":"大化改新","a":"Japan","p":"现图是一块巨石遗址。","d":"645年中大兄皇子与中臣镰足发动乙巳之变诛杀苏我入鹿后，孝德天皇于飞鸟京推行全面改革：仿唐制建中央集权官僚体系、颁行《近江令》雏形、实行班田收授法与租庸调制；此举终结氏姓贵族世袭体制，确立律令国家基础，深刻重塑日本政治经济结构；今日本奈良县高市郡明日香村。","q":"645年飞鸟，历史画：中大兄皇子与中臣镰足在板盖宫诛杀苏我入鹿，殿内血溅、群臣惊起，飞鸟寺与樱树，朱红与墨色"},{"m":"世界篇","t":4,"n":"阿斯旺大坝落成","a":"Egypt","p":"现图是清真寺。","d":"1970年7月21日，埃及总统纳赛尔主持竣工仪式，阿斯旺高坝在尼罗河上游正式落成；工程历时十年，由苏联提供技术援助，今位于埃及阿斯旺省阿斯旺市以南；大坝形成纳赛尔湖，彻底改变尼罗河水文节律，实现全年灌溉与电力供应，但也导致阿布辛贝神庙等古迹淹没，经联合国教科文组织跨国搬迁才得以保存。","q":"1971年阿斯旺，档案照片风格：大坝坝体与纳赛尔湖水面，埃及工程师与官员在坝顶剪彩，烈日与蓝色水面，彩色胶片"},{"m":"世界篇","t":5,"n":"克鲁亚围城战","a":"Albania","p":"现图是街边汽车与招牌。","d":"1450年，奥斯曼苏丹穆拉德二世亲率十万大军围攻阿尔巴尼亚中部要塞克鲁亚，今阿尔巴尼亚地拉那州克鲁亚市，由斯坎德培率领阿尔巴尼亚联军依托山地工事顽强抵抗半年之久，最终击退奥斯曼主力，此役打破奥斯曼不可战胜神话，激发巴尔干各族持久抵抗，斯坎德培据此建立长达二十五年的阿尔巴尼亚抵抗政权，延缓奥斯曼西进进程达数十年。","q":"1450年克鲁亚，历史画：斯坎德培率阿尔巴尼亚山地兵自城堡出击，奥斯曼军围攻营地大乱，山岩与石堡、新月旗"},{"m":"世界篇","t":5,"n":"巴布教起义","a":"Iran","p":"现图是山野天空。","d":"1848年，伊朗设拉子爆发巴布教徒武装起义，今伊朗法尔斯省设拉子市，由赛义德·阿里·穆罕默德（巴布）创立的新宗教运动引发社会动荡，起义者一度控制设拉子部分地区，遭卡扎尔王朝军队血腥镇压，巴布于1850年在大不里士被处决，但教义演变为巴哈伊信仰，对伊朗近代宗教思想变革与宪政运动产生深远影响，亦暴露卡扎尔政权治理危机。","q":"1848年设拉子，历史画：巴布教徒持刀枪在清真寺与街巷据守，政府军围攻，土墙与拱廊、硝烟，赭黄冷灰"},{"m":"世界篇","t":5,"n":"第一次瓜分波兰","a":"Poland","p":"现图是古地图。","d":"1772年第一次瓜分波兰由俄罗斯帝国、普鲁士王国与奥地利哈布斯堡君主国共同实施，三国军队未经大规模交战即占领波兰立陶宛联邦约30%领土与三分之一人口，华沙政府被迫于9月30日在俄军刺刀下签署承认条约；此为波兰亡国三部曲之始，标志东欧地缘格局剧变；今波兰首都华沙市。","q":"1772年华沙，历史画：俄普奥三国使节在华沙王宫逼迫波兰议会批准割地条约，议员跪伏抗议，王座与地图卷轴"}];
const tb=document.getElementById("tb");
function render(f){
  const q=(f||"").trim().toLowerCase();
  tb.innerHTML=D.filter(d=>!q||d.n.toLowerCase().includes(q)||(d.a||"").toLowerCase().includes(q)||d.q.toLowerCase().includes(q)||d.d.toLowerCase().includes(q))
   .map(d=>`<tr><td>${d.m}</td><td>${d.t}★</td><td class="n">${d.n}</td><td>${d.a||"—"}</td>
   <td class="p">${d.p}</td><td class="d">${d.d}</td><td class="q">${d.q}</td></tr>`).join("");
}
document.getElementById("q").addEventListener("input",e=>render(e.target.value));
render("");
</script></body></html>
